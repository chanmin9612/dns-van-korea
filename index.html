<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DNS. 업무 관리 시스템</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#f0f2f5;color:#1a1a1a;font-size:14px;}
.app{display:flex;height:100vh;}

/* Sidebar */
.sidebar{width:210px;min-width:210px;background:#1F3864;display:flex;flex-direction:column;overflow-y:auto;}
.sidebar-header{padding:22px 18px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.logo-mark{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;color:#fff;letter-spacing:-.5px;line-height:1;margin-bottom:7px;}
.logo-mark span{color:#C6F432;}
.co-name{display:none;}
.co-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:0;letter-spacing:.01em;}
.nav-section{padding:14px 18px 4px;font-size:9px;font-weight:600;color:rgba(255,255,255,.22);letter-spacing:.1em;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;font-size:13px;color:rgba(255,255,255,.48);cursor:pointer;margin:1px 0;transition:all .12s;}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.75);}
.nav-item.active{background:rgba(198,244,50,.1);color:#C6F432;font-weight:500;border-right:2px solid #C6F432;}
.nav-item .icon{font-size:15px;width:18px;text-align:center;}
.nav-badge{margin-left:auto;background:#C6F432;color:#1F3864;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:#fff;border-bottom:1px solid #e8e8e4;padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-size:15px;font-weight:600;color:#1a1a1a;}
.topbar-actions{display:flex;gap:8px;}
.content{flex:1;overflow-y:auto;padding:22px 24px;}
.page{display:none;}
.page.active{display:block;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:13px;font-family:inherit;border:1px solid #ddd;border-radius:7px;background:#fff;color:#333;cursor:pointer;transition:all .12s;}
.btn:hover{background:#f5f5f3;}
.btn-primary{background:#C6F432;color:#1F3864;border-color:#C6F432;font-weight:600;}
.btn-primary:hover{background:#b5e020;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-danger{border-color:#fca5a5;color:#b91c1c;}
.btn-danger:hover{background:#fff5f5;}
.btn-success{background:#e8f5ee;color:#0a6644;border-color:#b5ddc8;}
.btn-excel{background:#fff;color:#1a6b3c;border-color:#b5ddc8;}
.btn-excel:hover{background:#e8f5ee;}
/* Tab bar */
.tab-bar{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #e8e8e4;padding-bottom:0;}
.tab-btn{background:none;border:none;padding:8px 16px;font-size:13px;font-weight:500;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:0;}
.tab-btn:hover{color:#1F3864;background:#f5f5f3;}
.tab-btn.active{color:#1F3864;font-weight:700;border-bottom:2px solid #C6F432;}

/* Cards */
.card{background:#fff;border:1px solid #e8e8e4;border-radius:10px;padding:18px;margin-bottom:16px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:600;color:#1F3864;display:flex;align-items:center;gap:7px;}
.card-title::before{content:'';width:3px;height:14px;background:#C6F432;border-radius:2px;display:inline-block;}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.metric{background:#fff;border:1px solid #e8e8e4;border-top:3px solid #C6F432;border-radius:10px;padding:16px;}
.metric-label{font-size:11px;color:#888;margin-bottom:8px;font-weight:500;}
.metric-value{font-size:22px;font-weight:600;color:#1F3864;}
.metric-sub{font-size:11px;color:#aaa;margin-top:4px;}
.metric.alert{border-color:#fca5a5;background:#fff5f5;border-top-color:#fca5a5;}
.metric.alert .metric-value{color:#b91c1c;}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;padding:9px 12px;color:#888;font-weight:500;border-bottom:1px solid #e8e8e4;font-size:12px;white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid #f0f0ee;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#fafaf8;}

/* Badges */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;}
.badge-green{background:#e8f5ee;color:#0a6644;}
.badge-amber{background:#fff4e0;color:#a05c00;}
.badge-blue{background:#e8f0fb;color:#1a56a0;}
.badge-red{background:#feeaea;color:#b91c1c;}
.badge-gray{background:#f0f0ee;color:#555;}
.badge-purple{background:#f3e8ff;color:#6b21a8;}
.badge-teal{background:#e0f5f0;color:#0a7a60;}
.badge-navy{background:#e8ecf5;color:#16213e;}

/* Flow steps */
.flow-steps{display:flex;margin-bottom:20px;border-radius:8px;overflow:hidden;border:1px solid #e8e8e4;}
.flow-step{flex:1;text-align:center;padding:10px 6px;font-size:11px;color:#aaa;background:#f5f5f3;cursor:pointer;transition:all .12s;position:relative;}
.flow-step:not(:last-child){border-right:1px solid #e8e8e4;}
.flow-step.done{background:#e8f5ee;color:#0a6644;}
.flow-step.active{background:#16213e;color:#fff;font-weight:500;}
.flow-step:hover:not(.active){background:#ebebeb;}

/* Form */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;color:#666;margin-bottom:5px;font-weight:500;}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 11px;font-size:13px;font-family:inherit;border:1px solid #ddd;border-radius:7px;background:#fff;color:#1a1a1a;outline:none;transition:border-color .12s;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#1F3864;}
.form-textarea{min-height:72px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:1000;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:12px;padding:24px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-title{font-size:15px;font-weight:600;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid #e8e8e4;}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:2000;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:#0a6644;}
.toast.error{background:#b91c1c;}

/* Grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

/* Empty */
.empty-state{text-align:center;padding:48px;color:#aaa;}
.empty-state .es-icon{font-size:36px;margin-bottom:12px;}

/* Priority */
.priority-high{color:#b91c1c;font-weight:600;}
.priority-mid{color:#a05c00;}
.priority-low{color:#888;}

/* CS status bar */
.status-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.status-chip{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #e8e8e4;background:#fff;color:#555;transition:all .12s;}
.status-chip.active{background:#16213e;color:#fff;border-color:#16213e;}

/* Task type tabs */
.type-tabs{display:flex;gap:8px;margin-bottom:16px;}
.type-tab{padding:6px 16px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #e8e8e4;background:#fff;color:#555;font-weight:500;}
.type-tab.active{background:#16213e;color:#fff;border-color:#16213e;}

/* Stock bar */
.stock-bar{height:6px;background:#f0f0ee;border-radius:3px;margin-top:4px;}
.stock-fill{height:6px;border-radius:3px;}

.loading{text-align:center;padding:48px;color:#aaa;font-size:13px;}
</style>
</head>
<body>
<div class="app">

<!-- Sidebar -->
<nav class="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">DNS<span>.</span></div>
    <div class="co-sub">업무 관리 시스템</div>
  </div>
  <div class="nav-section">메인</div>
  <div class="nav-item active" data-page="dashboard"><span class="icon">📊</span>대시보드</div>
  <div class="nav-section">업무</div>
  <div class="nav-item" data-page="tasks"><span class="icon">📋</span>업무 현황<span class="nav-badge" id="badge-tasks">0</span></div>
  <div class="nav-item" data-page="cs"><span class="icon">🎧</span>CS 관리<span class="nav-badge" id="badge-cs">0</span></div>
  <div class="nav-section">운영 계획</div>
  <div class="nav-item" data-page="operation"><span class="icon">📅</span>운영 계획</div>
  <div class="nav-section">배송</div>
  <div class="nav-item" data-page="delivery"><span class="icon">🚚</span>배송 현황<span class="nav-badge" id="badge-delivery">0</span></div>
  <div class="nav-item" data-page="delivery-history"><span class="icon">📬</span>배송 이력</div>
  <div class="nav-section">재고/발주</div>
  <div class="nav-item" data-page="inventory"><span class="icon">📦</span>재고 관리</div>
  <div class="nav-item" data-page="orders"><span class="icon">🛒</span>발주 관리</div>
  <div class="nav-section">가맹점</div>
  <div class="nav-item" data-page="merchants"><span class="icon">🏪</span>가맹점 관리</div>
  <div class="nav-section">정산</div>
  <div class="nav-item" data-page="revenue"><span class="icon">💰</span>매출/정산</div>
</nav>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">대시보드</div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </div>
  <div class="content" id="content">
    <div class="loading">⏳ 불러오는 중...</div>
  </div>
</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">추가</div>
      <button class="btn btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="modal-save-btn">저장</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// =============================================
// SUPABASE
// =============================================
const SUPABASE_URL = 'https://maqsveskwhtoqqeysnca.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hcXN2ZXNrd2h0b3FxZXlzbmNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NzUyNDAsImV4cCI6MjA5NjU1MTI0MH0.CJAVzPPsWiRhgJS3aaMxdsA3L176jhO2KJnMg9ZOlwQ';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =============================================
// NAV
// =============================================
const pageConfig = {
  dashboard: { title: '대시보드', addBtn: null },
  tasks:     { title: '업무 현황', addBtn: { label: '업무 등록', fn: () => openAddTask() } },
  operation: { title: '운영 계획 — 2026 하반기', addBtn: null },
  cs:        { title: 'CS 관리',  addBtn: { label: 'CS 접수',   fn: () => openAddCS() } },
  delivery:  { title: '배송 현황', addBtn: { label: '배송 등록', fn: () => openAddDelivery() } },
  'delivery-history': { title: '배송 이력', addBtn: { label: '배송 등록', fn: () => openAddDelivery() } },
  inventory: { title: '재고 관리',addBtn: null },
  orders:    { title: '발주 관리',addBtn: { label: '발주 등록', fn: () => openAddOrder() } },
  merchants: { title: '가맹점 관리', addBtn: { label: '가맹점 추가', fn: () => openAddMerchant() } },
  revenue:   { title: '매출/정산', addBtn: { label: '매출 입력', fn: () => openAddRevenue() } },
};

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    loadPage(el.dataset.page);
  });
});

function loadPage(page) {
  const cfg = pageConfig[page];
  document.getElementById('topbar-title').textContent = cfg.title;
  const actions = document.getElementById('topbar-actions');
  actions.innerHTML = '';
  if (cfg.addBtn) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.innerHTML = '+ ' + cfg.addBtn.label;
    btn.onclick = cfg.addBtn.fn;
    actions.appendChild(btn);
  }
  document.getElementById('content').innerHTML = '<div class="loading">⏳ 불러오는 중...</div>';
  const renderers = { dashboard: renderDashboard, tasks: renderTasks, cs: renderCS, operation: renderOperation,
    delivery: renderDelivery, 'delivery-history': renderDeliveryHistory,
    inventory: renderInventory, orders: renderOrders, merchants: renderMerchants, revenue: renderRevenue };
  renderers[page]();
}

// =============================================
// TOAST & MODAL
// =============================================
function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2500);
}

let _modalSaveFn = null;
function openModal(title, bodyHtml, saveFn) {
  _modalSaveFn = saveFn;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML =
    '<button class="btn" onclick="closeModal()">취소</button>' +
    '<button class="btn btn-primary" onclick="_modalSaveFn && _modalSaveFn()">저장</button>';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

// =============================================
// HELPERS
// =============================================
function v(id) { return document.getElementById(id)?.value || ''; }
function today() { return new Date().toISOString().slice(0, 10); }
function thisMonth() { return new Date().toISOString().slice(0, 7); }
function genNo(prefix) { return prefix + '-' + Date.now().toString().slice(-6); }
function dbError(e) { return '<div class="card"><div style="color:#b91c1c;padding:16px;font-size:13px;">⚠️ 오류: ' + e.message + '</div></div>'; }
function emptyState(msg) { return '<div class="empty-state"><div class="es-icon">📭</div><div>' + msg + '</div></div>'; }

function taskStatusBadge(status) {
  const m = { '요청접수':'badge-gray','주문완료':'badge-blue','입고완료':'badge-teal',
    '수거완료':'badge-blue','수신완료':'badge-blue','본사발송':'badge-amber',
    '견적수령':'badge-purple','재고확인':'badge-amber','발주중':'badge-amber',
    '발송완료':'badge-green','설치완료':'badge-green','완료':'badge-green' };
  return '<span class="badge ' + (m[status]||'badge-gray') + '">' + status + '</span>';
}
function csStatusBadge(s) {
  const m = { '접수':'badge-gray','처리중':'badge-amber','완료':'badge-green','보류':'badge-red' };
  return '<span class="badge ' + (m[s]||'badge-gray') + '">' + s + '</span>';
}
function priorityBadge(p) {
  if (p==='긴급') return '<span class="badge badge-red">🔴 긴급</span>';
  if (p==='보통') return '<span class="badge badge-amber">🟡 보통</span>';
  return '<span class="badge badge-gray">🔵 낮음</span>';
}
function typeBadge(t) {
  if (t==='VAN') return '<span class="badge badge-blue">VAN</span>';
  if (t==='PG') return '<span class="badge badge-amber">PG</span>';
  return '<span class="badge badge-gray">VAN+PG</span>';
}
function taskTypeBadge(t) {
  if (t==='설치') return '<span class="badge badge-blue">설치</span>';
  if (t==='수리') return '<span class="badge badge-amber">수리</span>';
  return '<span class="badge badge-teal">소모품</span>';
}
function categoryBadge(c) {
  if (c==='단말기') return '<span class="badge badge-navy">단말기</span>';
  if (c==='싸인패드') return '<span class="badge badge-purple">싸인패드</span>';
  return '<span class="badge badge-gray">소모품</span>';
}

// =============================================
// DASHBOARD
// =============================================
async function renderDashboard() {
  try {
    await loadKisLatest();
    const [{ data: tasks }, { data: cs }, { data: devices }, { data: supplies }, { data: orders }] = await Promise.all([
      db.from('tasks').select('*'),
      db.from('cs_tickets').select('*'),
      db.from('inventory_device').select('*'),
      db.from('inventory_supply').select('*'),
      db.from('orders').select('*').order('created_at', { ascending: false }).limit(5),
    ]);

    const activeTasks = (tasks||[]).filter(t => t.status !== '완료');
    const urgentCS = (cs||[]).filter(c => c.status !== '완료' && c.priority === '긴급');
    const openCS = (cs||[]).filter(c => c.status !== '완료');
    const lowStock = (supplies||[]).filter(s => s.stock <= s.min_stock);

    // 배지 업데이트
    document.getElementById('badge-tasks').textContent = activeTasks.length;
    document.getElementById('badge-cs').textContent = openCS.length;

    const install = activeTasks.filter(t=>t.type==='설치').length;
    const repair  = activeTasks.filter(t=>t.type==='수리').length;
    const supply  = activeTasks.filter(t=>t.type==='소모품').length;

    // KIS 수익 카드
    const kisTotal   = window._kisLatestTotal || 0;
    const kisPrev    = window._kisPrevTotal   || 0;
    const kisDiff    = kisTotal - kisPrev;
    const kisDiffPct = kisPrev > 0 ? Math.round(kisDiff / kisPrev * 100) : 0;
    const kisMonth   = window._kisLatestMonth || '-';
    const kisArrow   = kisDiff >= 0
      ? '<span style="color:#0a6644">▲ ' + kisDiffPct + '%</span>'
      : '<span style="color:#b91c1c">▼ ' + Math.abs(kisDiffPct) + '%</span>';
    const kisSubText = kisPrev > 0
      ? '전월 대비 ' + kisArrow
      : (kisTotal > 0 ? kisMonth + ' 정산' : '정산 데이터 없음');

    // 이번 달 기준 '지난달' 정산 데이터가 저장돼 있는지 확인 → 없으면 업로드 리마인더 배너
    const targetMonth = (() => {
      const d = new Date(); d.setMonth(d.getMonth() - 1);
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    })();
    const reminderBanner = (window._kisLatestMonth !== targetMonth) ? `
      <div style="background:#fff8e8;border:1px solid #f0d080;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:20px">📂</span>
          <div>
            <div style="font-size:13px;font-weight:700;color:#92400e">${targetMonth} KIS 정산 파일을 아직 업로드하지 않았어요</div>
            <div style="font-size:11px;color:#92400e;margin-top:2px">매달 초 BILLING 사이트에서 파일을 받아 업로드해주세요</div>
          </div>
        </div>
        <button class="btn btn-sm" style="background:#1F3864;color:#C6F432;border-color:#1F3864" onclick="loadPage('revenue')">지금 업로드하기</button>
      </div>` : '';

    let html = reminderBanner + '<div class="metrics">' +

let taskFilter = '전체';
async function renderTasks() {
  try {
    await loadKisLatest();
    const { data, error } = await db.from('tasks').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    window._tasks = data || [];

    // 이번 주 운영 계획 할 일
    const thisWeekOp = getThisWeekTasks();
    let html = '';
    if (thisWeekOp.length > 0) {
      html += '<div style="background:#fff;border:1.5px solid #C6F432;border-radius:10px;padding:14px;margin-bottom:14px;">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">' +
          '<div style="font-size:13px;font-weight:600;color:#1F3864;">📅 이번 주 운영 계획</div>' +
          '<a href="#" onclick="loadPage(&quot;operation&quot;);return false;" style="font-size:11px;color:#888;text-decoration:none;">전체 보기 →</a>' +
        '</div>';
      thisWeekOp.slice(0,4).forEach(item => {
        html += '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #fafaf8;">' +
          '<div style="width:6px;height:6px;border-radius:50%;background:#C6F432;flex-shrink:0;"></div>' +
          '<div style="font-size:12px;color:#333;">' + item.text + '</div>' +
        '</div>';
      });
      if (thisWeekOp.length > 4) {
        html += '<div style="font-size:11px;color:#888;text-align:center;padding-top:6px;">외 ' + (thisWeekOp.length-4) + '건 더보기</div>';
      }
      html += '</div>';
    }

    const types = ['전체','설치','수리','소모품'];
    html += '<div class="type-tabs">' + types.map(t =>
      '<div class="type-tab ' + (taskFilter===t?'active':'') + '" onclick="setTaskFilter(\'' + t + '\')">' + t + '</div>'
    ).join('') + '</div>';

    const filtered = taskFilter === '전체' ? window._tasks : window._tasks.filter(t => t.type === taskFilter);
    const active = filtered.filter(t => t.status !== '완료');
    const done = filtered.filter(t => t.status === '완료');

    html += '<div class="card"><div class="card-header"><div class="card-title">진행 중 (' + active.length + '건)</div></div>';
    if (active.length === 0) { html += emptyState('진행 중인 업무가 없습니다'); }
    else {
      html += '<table><thead><tr><th>유형</th><th>가맹점</th><th>품목</th><th>업체</th><th>방법</th><th>상태</th><th>담당자</th><th>요청일</th><th></th></tr></thead><tbody>';
      active.forEach(t => {
        const mName = t.merchant_name || '-';
        const kisTag = window._kisTopNames && window._kisTopNames.has(mName)
          ? '<span style="background:#C6F432;color:#1F3864;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;margin-left:3px">TOP</span>'
          : window._kisBotNames && window._kisBotNames.has(mName)
          ? '<span style="background:#fee2e2;color:#b91c1c;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;margin-left:3px">LOW</span>'
          : '';
        html += '<tr>' +
          '<td>' + taskTypeBadge(t.type) + '</td>' +
          '<td><strong>' + mName + '</strong>' + kisTag + '</td>' +
          '<td>' + (t.item_name||'-') + '</td>' +
          '<td>' + (t.vendor ? '<span class="badge badge-navy">' + t.vendor + '</span>' : '-') + '</td>' +
          '<td style="color:#888">' + (t.method||'-') + '</td>' +
          '<td>' + taskStatusBadge(t.status) + '</td>' +
          '<td>' + (t.manager||'-') + '</td>' +
          '<td style="color:#888;font-size:12px">' + (t.request_date||'-') + '</td>' +
          '<td style="display:flex;gap:4px;">' +
            '<button class="btn btn-sm" onclick="openEditTask(' + t.id + ')">편집</button>' +
            '<button class="btn btn-sm btn-success" onclick="completeTask(' + t.id + ')">완료</button>' +
            '<button class="btn btn-sm btn-danger" onclick="deleteTask(' + t.id + ')">삭제</button>' +
          '</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';

    if (done.length > 0) {
      html += '<div class="card"><div class="card-header"><div class="card-title">완료 (' + done.length + '건)</div></div>';
      html += '<table><thead><tr><th>유형</th><th>가맹점</th><th>품목</th><th>완료일</th><th></th></tr></thead><tbody>';
      done.slice(0,10).forEach(t => {
        html += '<tr>' +
          '<td>' + taskTypeBadge(t.type) + '</td>' +
          '<td>' + (t.merchant_name||'-') + '</td>' +
          '<td>' + (t.item_name||'-') + '</td>' +
          '<td style="color:#888;font-size:12px">' + (t.completed_date||'-') + '</td>' +
          '<td><button class="btn btn-sm btn-danger" onclick="deleteTask(' + t.id + ')">삭제</button></td>' +
          '</tr>';
      });
      html += '</tbody></table></div>';
    }

    document.getElementById('content').innerHTML = html;
  } catch(e) { document.getElementById('content').innerHTML = dbError(e); }
}

function updateTaskStatuses() {
  const type = v('tk-type');
  const statuses = getTaskStatuses(type);

  if (sel) sel.innerHTML = statuses.map(s => '<option>' + s + '</option>').join('');

async function openAddTask() {
  if (!window._merchants || window._merchants.length === 0) {
    const { data } = await db.from('merchants').select('id, name, address, biz_no').order('name');
    window._merchants = (data||[]).slice().sort((a,b) => a.name.localeCompare(b.name,'ko'));
  }
  openModal('업무 등록', taskForm(), async () => {
    const merchant_name = v('tk-merchant');
    if (!merchant_name) return toast('가맹점명을 입력해주세요.', 'error');
    const { error } = await db.from('tasks').insert({
      task_no: genNo('TASK'), type: v('tk-type'), merchant_name,
      item_name: v('tk-item'), vendor: v('tk-vendor'), method: v('tk-method'),
      status: v('tk-status'), manager: v('tk-manager'), tracking_no: v('tk-tracking'),
      request_date: v('tk-req'), due_date: v('tk-due'), note: v('tk-note')
    });
    if (error) return toast('저장 실패: ' + error.message, 'error');
    toast('업무가 등록되었습니다.'); closeModal(); renderTasks();
  });
}

async function openEditTask(id) {
  if (!window._merchants || window._merchants.length === 0) {
    const { data } = await db.from('merchants').select('id, name, address, biz_no').order('name');
    window._merchants = (data||[]).slice().sort((a,b) => a.name.localeCompare(b.name,'ko'));
  }
  const t = (window._tasks||[]).find(x => x.id === id);
  if (!t) return;
  openModal('업무 편집', taskForm(t), async () => {
    const { error } = await db.from('tasks').update({
      type: v('tk-type'), merchant_name: v('tk-merchant'),
      item_name: v('tk-item'), vendor: v('tk-vendor'), method: v('tk-method'),
      status: v('tk-status'), manager: v('tk-manager'), tracking_no: v('tk-tracking'),
      request_date: v('tk-req'), due_date: v('tk-due'), note: v('tk-note')
    }).eq('id', id);
    if (error) return toast('저장 실패: ' + error.message, 'error');
    toast('수정되었습니다.'); closeModal(); renderTasks();
  });
}

async function completeTask(id) {
  const { error } = await db.from('tasks').update({ status: '완료', completed_date: today() }).eq('id', id);
  if (error) return toast('오류: ' + error.message, 'error');
  toast('완료 처리되었습니다.'); renderTasks();
}

async function deleteTask(id) {
  if (!confirm('이 업무를 삭제할까요?')) return;
  const { error } = await db.from('tasks').delete().eq('id', id);
  if (error) return toast('삭제 실패', 'error');
  toast('삭제되었습니다.'); renderTasks();
}

// =============================================
// 재고 자동 차감/증가 함수
// =============================================
const DEVICE_KEYWORDS  = ['단말기','사인패드','포스기','KIS','SP-','NP','토스프론트'];
const SUPPLY_MAP = { '감열지':'감열지', '어댑터':'어댑터', 'LAN 케이블':'LAN 케이블', 'USB 케이블':'LAN 케이블', '케이블':'LAN 케이블' };

async function adjustInventoryStock(itemName, quantityStr, direction) {
  if (!itemName) return;
  const qty = parseInt(quantityStr) || 1;
  const delta = direction === 'out' ? -qty : qty;

  // 소모품 체크
  const supplyKey = Object.keys(SUPPLY_MAP).find(k => itemName.includes(k));
  if (supplyKey) {
    const targetName = SUPPLY_MAP[supplyKey];
    const { data } = await db.from('inventory_supply').select('id, stock').eq('name', targetName).single();
    if (data) {
      const newStock = Math.max(0, (data.stock||0) + delta);
      await db.from('inventory_supply').update({ stock: newStock }).eq('id', data.id);
    }
    return;
  }

  // 기기 체크
  const isDevice = DEVICE_KEYWORDS.some(k => itemName.includes(k));
  if (isDevice) {
    const modelMatch = itemName.match(/[A-Z]{2,}-\d+[A-Z0-9]*/);
    if (modelMatch) {
      const { data } = await db.from('inventory_device').select('id, stock_normal').ilike('model_name', '%' + modelMatch[0] + '%').single();
      if (data) {
        const newNormal = Math.max(0, (data.stock_normal||0) + delta);
        await db.from('inventory_device').update({ stock_normal: newNormal }).eq('id', data.id);
      }
    }
  }
}

    '<div class="form-group"><label class="form-label">업체 *</label><select id="or-vendor" class="form-select">' +
    ['토스','KIS','기타'].map(s => '<option ' + (o.vendor===s?'selected':'') + '>' + s + '</option>').join('') +
    '</select></div>' +
    '<div class="form-group"><label class="form-label">구분</label><select id="or-cat" class="form-select"><option value="">선택</option>' +
    ['단말기','싸인패드','소모품'].map(s => '<option ' + (o.category===s?'selected':'') + '>' + s + '</option>').join('') +
    '</select></div>' +
    '</div><div class="form-row">' +
    '<div class="form-group"><label class="form-label">품목명 *</label><input id="or-item" class="form-input" value="' + (o.item_name||'') + '" placeholder="품목명"/></div>' +
    '<div class="form-group"><label class="form-label">수량</label><input id="or-qty" class="form-input" type="number" value="' + (o.quantity||1) + '"/></div>' +
    '</div><div class="form-row">' +
    '<div class="form-group"><label class="form-label">발주일</label><input id="or-date" class="form-input" type="date" value="' + (o.order_date||today()) + '"/></div>' +
    '<div class="form-group"><label class="form-label">입고 예정일</label><input id="or-exp" class="form-input" type="date" value="' + (o.expected_date||'') + '"/></div>' +
    '</div><div class="form-row">' +
    '<div class="form-group"><label class="form-label">상태</label><select id="or-status" class="form-select">' +
    ['주문완료','배송중','입고완료'].map(s => '<option ' + (o.status===s?'selected':'') + '>' + s + '</option>').join('') +
    '</select></div>' +
    '<div class="form-group"><label class="form-label">메모</label><input id="or-note" class="form-input" value="' + (o.note||'') + '"/></div>' +
    '</div>';
}

function openAddOrder() {
  openModal('발주 등록', orderForm(), async () => {
    const item_name = v('or-item');
    if (!item_name) return toast('품목명을 입력해주세요.', 'error');
    const { error } = await db.from('orders').insert({
      order_no: genNo('ORD'), vendor: v('or-vendor'), category: v('or-cat'),
      item_name, quantity: parseInt(v('or-qty'))||1,
      order_date: v('or-date'), expected_date: v('or-exp'), status: v('or-status'), note: v('or-note')
    });
    if (error) return toast('저장 실패: ' + error.message, 'error');
    toast('발주가 등록되었습니다.'); closeModal(); renderOrders();
  });
}

function openEditOrder(id) {
  const o = (window._orders||[]).find(x => x.id === id);
  if (!o) return;
  openModal('발주 편집', orderForm(o), async () => {
    const { error } = await db.from('orders').update({
      vendor: v('or-vendor'), category: v('or-cat'), item_name: v('or-item'),
      quantity: parseInt(v('or-qty'))||1, order_date: v('or-date'),
      expected_date: v('or-exp'), status: v('or-status'), note: v('or-note')
    }).eq('id', id);
    if (error) return toast('저장 실패: ' + error.message, 'error');
    toast('수정되었습니다.'); closeModal(); renderOrders();
  });
}

async function arriveOrder(id) {
  const o = (window._orders||[]).find(x => x.id === id);
  const { error } = await db.from('orders').update({ status: '입고완료', arrived_date: today() }).eq('id', id);
  if (error) return toast('오류', 'error');
  if (o) await adjustInventoryStock(o.item_name, String(o.quantity), 'in');
  toast('입고 처리되었습니다. 재고가 자동 반영되었습니다.'); renderOrders();
}

async function deleteOrder(id) {
  if (!confirm('이 발주를 삭제할까요?')) return;
  const { error } = await db.from('orders').delete().eq('id', id);
  if (error) return toast('삭제 실패', 'error');
  toast('삭제되었습니다.'); renderOrders();
}

function categoryBadge(c) {
  if (c==='단말기') return '<span class="badge badge-navy">단말기</span>';
  if (c==='싸인패드') return '<span class="badge badge-purple">싸인패드</span>';
  return '<span class="badge badge-gray">소모품</span>';
}

async function renderMerchants() {
  const contentEl = document.getElementById('content');
  try {
    await loadKisLatest();
    const { data, error } = await db.from('merchants').select('*');
    if (error) throw error;
    window._merchants = (data||[]).slice().sort((a,b) => a.name.localeCompare(b.name,'ko'));
    window._merchantSearch = window._merchantSearch || '';
    window._merchantFilter = window._merchantFilter || '전체';

    // KIS 요약 카드 데이터 계산
    const all = window._merchants || [];
    const kisMap = window._kisMap || {};
    const kisPrevMap = window._kisPrevMap || {};
    const kisMonth = window._kisLatestMonth || '';

    const topCount  = all.filter(m => window._kisTopNames && window._kisTopNames.has(m.name)).length;
    const botCount  = all.filter(m => (window._kisBotNames && window._kisBotNames.has(m.name)) || m.risk_level === '관리대상').length;
    const dropCount = all.filter(m => {
      const cur = kisMap[m.name]; const prev = kisPrevMap[m.name];
      if (!cur || !prev || prev.approval <= 0) return false;
      return (prev.approval - cur.approval) / prev.approval * 100 >= 30;
    }).length;

    const summaryCards = kisMonth ? `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
        <div style="background:#f0fff4;border:1px solid #b5ddc8;border-radius:10px;padding:12px 14px;cursor:pointer" onclick="setMerchantFilter('우수')">
          <div style="font-size:11px;font-weight:600;color:#0a6644;margin-bottom:4px">⭐ 우수 가맹점 (TOP 20%)</div>
          <div style="font-size:20px;font-weight:600;color:#0a6644">${topCount}곳</div>
          <div style="font-size:11px;color:#3a6000;margin-top:2px">${kisMonth} 기준</div>
        </div>
        <div style="background:#fff8e8;border:1px solid #f0d080;border-radius:10px;padding:12px 14px;cursor:pointer" onclick="setMerchantFilter('건수급감')">
          <div style="font-size:11px;font-weight:600;color:#92400e;margin-bottom:4px">⚠ 건수 급감 감지</div>
          <div style="font-size:20px;font-weight:600;color:#b45309">${dropCount}곳</div>
          <div style="font-size:11px;color:#92400e;margin-top:2px">전월 대비 30% 이상 감소</div>
        </div>
        <div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:12px 14px;cursor:pointer" onclick="setMerchantFilter('관리대상')">
          <div style="font-size:11px;font-weight:600;color:#991b1b;margin-bottom:4px">관리 대상 (LOW 20%)</div>
          <div style="font-size:20px;font-weight:600;color:#b91c1c">${botCount}곳</div>
          <div style="font-size:11px;color:#991b1b;margin-top:2px">${kisMonth} 기준</div>
        </div>
      </div>` : '';

    const filterTabs = `
      <div id="merchant-filter-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
        ${['전체','우수','건수급감','관리대상','이탈위험','휴면','폐업'].map(f => {
          const active = (window._merchantFilter||'전체') === f;
          const color = f==='우수' ? 'color:#0a6644;border-color:#b5ddc8;background:#f0fff4'
            : f==='건수급감' ? 'color:#92400e;border-color:#f0d080;background:#fff8e8'
            : f==='관리대상' ? 'color:#991b1b;border-color:#fca5a5;background:#fef2f2'
            : 'color:#1F3864;border-color:#C6F432;background:#f9fde8';
          return `<button class="btn btn-sm" data-filter="${f}" data-color="${color.replace(/"/g,'&quot;')}" style="${active ? color : ''}" onclick="setMerchantFilter('${f}')">${f}</button>`;
        }).join('')}
      </div>`;

    contentEl.innerHTML =
      summaryCards +
      '<div class="card">' +
        '<div class="card-header">' +
          '<div class="card-title">가맹점 목록 (' + window._merchants.length + '곳)</div>' +
          '<div style="display:flex;gap:8px;">' +
            '<button class="btn btn-sm btn-excel" onclick="downloadMerchantTemplate()">📥 양식 다운로드</button>' +
            '<button class="btn btn-sm" style="color:#7c3aed;border-color:#c4b5fd;background:#fff;" onclick="triggerMerchantUpload()">📤 엑셀 업로드</button>' +
            '<button class="btn btn-sm btn-excel" onclick="exportMerchantsExcel()">📊 엑셀 저장</button>' +
          '</div>' +
        '</div>' +
        filterTabs +
        '<div style="margin-bottom:14px;position:relative;">' +
          '<input id="merchant-search" class="form-input" placeholder="🔍 가맹점명, 사업자번호, 연락처, 주소 검색..." style="padding-left:14px;"/>' +
          '<button id="merchant-search-clear" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;font-size:16px;">✕</button>' +
        '</div>' +
        '<div id="merchant-result-count" style="font-size:12px;color:#888;margin-bottom:8px;"></div>' +
        '<div id="merchant-table-wrap"></div>' +
      '</div>';

    // 검색 이벤트
    const searchEl = document.getElementById('merchant-search');
    const clearEl  = document.getElementById('merchant-search-clear');
    searchEl.value = window._merchantSearch;
    searchEl.addEventListener('input', function() {
      window._merchantSearch = this.value;
      clearEl.style.display = this.value ? 'block' : 'none';
      renderMerchantRows();
    });
    clearEl.addEventListener('click', function() {
      window._merchantSearch = '';
      searchEl.value = '';
      clearEl.style.display = 'none';
      renderMerchantRows();
    });

    renderMerchantRows();
  } catch(e) { document.getElementById('content').innerHTML = dbError(e); }
}

function setMerchantFilter(f) {
  window._merchantFilter = f;
  // 탭 버튼 활성 스타일 즉시 갱신 (전체 재조회 없이)
  const tabsWrap = document.getElementById('merchant-filter-tabs');
  if (tabsWrap) {
    tabsWrap.querySelectorAll('button[data-filter]').forEach(btn => {
      const isActive = btn.getAttribute('data-filter') === f;
      btn.setAttribute('style', isActive ? btn.getAttribute('data-color') : '');
    });
  }
  renderMerchantRows();
}

function renderMerchantRows() {
  const q = (window._merchantSearch || '').toLowerCase().trim();
  const filter = window._merchantFilter || '전체';
  const all = window._merchants || [];
  let filtered = q ? all.filter(m =>
    (m.name||'').toLowerCase().includes(q) ||
    (m.biz_no||'').includes(q) ||
    (m.phone||'').includes(q) ||
    (m.address||'').toLowerCase().includes(q)
  ) : all;
  if (filter === '미조사') filtered = filtered.filter(m => !m.survey_done);
  else if (filter === '조사완료') filtered = filtered.filter(m => m.survey_done);
  else if (filter === '이탈위험') filtered = filtered.filter(m => m.risk_level === '이탈위험');
  else if (filter === '관리대상') filtered = filtered.filter(m =>
    (window._kisBotNames && window._kisBotNames.has(m.name)) || m.risk_level === '관리대상');
  else if (filter === '휴면') filtered = filtered.filter(m => m.risk_level === '휴면');
  else if (filter === '폐업') filtered = filtered.filter(m => m.risk_level === '폐업');
  else if (filter === '우수') filtered = filtered.filter(m => window._kisTopNames && window._kisTopNames.has(m.name));
  else if (filter === '건수급감') filtered = filtered.filter(m => {
    const cur = (window._kisMap||{})[m.name];
    const prev = (window._kisPrevMap||{})[m.name];
    if (!cur || !prev || prev.approval <= 0) return false;
    return (prev.approval - cur.approval) / prev.approval * 100 >= 30;
  });

  // 기본 정렬: KIS 수익 내림차순 (우수 가맹점이 위, 관리대상이 아래로 자연스럽게 정렬)
  // 검색 중일 때는 이름순 유지 (찾기 쉽도록)
  if (!q) {
    filtered = filtered.slice().sort((a, b) => {
      const feeA = (window._kisMap||{})[a.name]?.total || 0;
      const feeB = (window._kisMap||{})[b.name]?.total || 0;
      return feeB - feeA;
    });
  }

  window._merchantsFiltered = filtered; // 현재 필터 결과를 엑셀 저장에서 사용

  const countEl = document.getElementById('merchant-result-count');
  if (countEl) countEl.textContent = q ? '검색결과 ' + filtered.length + '곳' : '';

  const wrap = document.getElementById('merchant-table-wrap');
  if (!wrap) return;

  if (filtered.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="es-icon">📭</div><div>' + (q ? '검색 결과가 없습니다.' : '등록된 가맹점이 없습니다.') + '</div></div>';
    return;
  }

  let rows = '';
  filtered.forEach(m => {
    const noteBtn = m.note ? '<button class="btn btn-sm" style="color:#1a56a0;border-color:#b5d4f4;" onclick="viewMerchantNote(' + m.id + ')">메모</button>' : '';
    // 이상 있을 때만 배지 표시 (정상은 노이즈이므로 생략)
    const riskBadge = m.risk_level === '폐업' ? '<span style="background:#1a1a1a;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;">폐업</span>' :
      m.risk_level === '이탈위험' ? '<span class="badge badge-red">이탈위험</span>' :
      m.risk_level === '휴면' ? '<span class="badge badge-gray">휴면</span>' : '-';
    const monthlyStr = m.monthly_amount > 0 ? '₩' + (m.monthly_amount/10000).toFixed(0) + '만' : '-';

    // KIS 정산 수익 배지
    const kisData = (window._kisMap || {})[m.name];
    const kisPrev = (window._kisPrevMap || {})[m.name];
    let kisBadge = '';
    if (kisData) {
      const fee = kisData.total;
      kisBadge = '<span style="color:#1F3864;font-weight:700;font-size:13px">₩' + fee.toLocaleString() + '</span>';
    }

    // 수익 순위 태그 (우수/관리대상)
    let rankTag = '';
    if (window._kisTopNames && window._kisTopNames.has(m.name)) {
      rankTag = '<span style="background:#C6F432;color:#1F3864;font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:4px">TOP</span>';
    } else if ((window._kisBotNames && window._kisBotNames.has(m.name)) || m.risk_level === '관리대상') {
      rankTag = '<span style="background:#fee2e2;color:#b91c1c;font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:4px">LOW</span>';
    }

    // 이탈 위험 자동 감지: 전월 대비 건수 30% 이상 감소
    let alertTag = '';
    if (kisData && kisPrev && kisPrev.approval > 0) {
      const dropPct = (kisPrev.approval - kisData.approval) / kisPrev.approval * 100;
      if (dropPct >= 30) {
        alertTag = '<span style="background:#fff3d6;color:#92400e;font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;margin-left:4px">건수↓' + Math.round(dropPct) + '%</span>';
      }
    }

    rows +=
      '<tr>' +
      '<td><strong>' + (m.name||'-') + '</strong>' + rankTag + alertTag + '</td>' +
      '<td style="color:#888">' + (m.biz_no||'-') + '</td>' +
      '<td>' + (m.phone||'-') + '</td>' +
      '<td>' + (m.business_type ? '<span class="badge badge-navy">' + m.business_type + '</span>' : '-') + '</td>' +
      '<td style="font-size:12px;color:#1F3864;font-weight:600;">' + monthlyStr + '</td>' +
      '<td>' + (kisBadge || '-') + '</td>' +
      '<td>' + riskBadge + '</td>' +
      '<td style="display:flex;gap:4px;">' + noteBtn +
        '<button class="btn btn-sm" onclick="editMerchant(' + m.id + ')">편집</button>' +
        '<button class="btn btn-sm btn-danger" onclick="deleteMerchant(' + m.id + ')">삭제</button>' +
      '</td></tr>';
  });

  const kisMonth = window._kisLatestMonth ? '(' + window._kisLatestMonth + ')' : '';
  wrap.innerHTML =
    '<table><thead><tr>' +
    '<th>가맹점명</th><th>사업자번호</th><th>연락처</th><th>업종</th><th>월결제</th>' +
    '<th style="color:#1F3864">KIS수익' + kisMonth + '</th>' +
    '<th>특이사항</th><th></th>' +
    '</tr></thead><tbody id="merchant-list">' + rows + '</tbody></table>';
}

function openAddMerchant() {
  openModal('가맹점 추가', merchantForm(), async () => {
    const name = v('m-name');
    if (!name) return toast('가맹점명을 입력해주세요.', 'error');
    const { error } = await db.from('merchants').insert({
      name, biz_no: v('m-biz'), phone: v('m-phone'), address: v('m-addr'),
      type: v('m-type'), status: v('m-status'), note: v('m-note'),
      business_type: v('m-btype'), risk_level: v('m-risk'),
      monthly_count: parseInt(v('m-mcount'))||0,
      monthly_amount: parseInt(v('m-mamount'))||0,

function triggerMerchantUpload() {
  let input = document.getElementById('merchant-upload-input');
  if (!input) {
    input = document.createElement('input');
    input.type = 'file';
    input.id = 'merchant-upload-input';
    input.accept = '.xlsx,.xls';
    input.style.display = 'none';
    input.onchange = function() { uploadMerchantExcel(this); };
    document.body.appendChild(input);
  }
  input.value = '';
  input.click();
}

async function uploadMerchantExcel(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  toast('파일 읽는 중...', 'success');
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      let headerRow = -1;
      for (let i = 0; i < Math.min(raw.length, 10); i++) {
        const row = raw[i].map(c => String(c).replace('*','').trim());
        if (row.includes('가맹점명') && row.includes('사업자번호')) { headerRow = i; break; }
      }
      if (headerRow === -1) return toast('헤더를 찾을 수 없습니다. 양식을 확인해주세요.', 'error');

      const headers = raw[headerRow].map(c => String(c).replace('*','').trim());
      const idx = {
        name:   headers.indexOf('가맹점명'),
        biz:    headers.indexOf('사업자번호'),
        phone:  headers.indexOf('연락처'),
        addr:   headers.indexOf('주소'),
        type:   headers.indexOf('구분'),
        status: headers.indexOf('상태'),
        note:   headers.indexOf('메모'),
      };
      if (idx.name === -1 || idx.biz === -1) return toast('가맹점명 또는 사업자번호 컬럼을 찾을 수 없습니다.', 'error');

      const dataRows = raw.slice(headerRow + 1).filter(r => r[idx.name] && r[idx.biz]);
      if (dataRows.length === 0) return toast('업로드할 데이터가 없습니다.', 'error');

      const preview = dataRows.slice(0,3).map(r => r[idx.name]).join(', ');
      const more = dataRows.length > 3 ? ' 외 ' + (dataRows.length-3) + '건' : '';
      if (!confirm('총 ' + dataRows.length + '건 업로드 (' + preview + more + '). 계속할까요?')) return;

      // 진행 상태 표시
      const toastEl = document.getElementById('toast');
      const showProgress = (done, total) => {
        toastEl.textContent = '업로드 중... ' + done + ' / ' + total + '건';
        toastEl.className = 'toast show success';
      };
      showProgress(0, dataRows.length);

      const { data: existing } = await db.from('merchants').select('id, biz_no');
      const normalize = s => String(s||'').replace(/[^0-9]/g,'');
      const existingMap = {};
      (existing||[]).forEach(m => { existingMap[normalize(m.biz_no)] = m.id; });

      let updated = 0, added = 0, errors = 0;
      const validTypes  = ['VAN','PG','VAN+PG'];
      const validStatus = ['운영중','계약중','해지'];

      for (const row of dataRows) {
        const name    = String(row[idx.name]   ||'').trim();
        const biz_no  = String(row[idx.biz]    ||'').trim();
        const phone   = idx.phone  >= 0 ? String(row[idx.phone]  ||'').trim() : '';
        const address = idx.addr   >= 0 ? String(row[idx.addr]   ||'').trim() : '';
        const type    = idx.type   >= 0 ? String(row[idx.type]   ||'').trim() : 'VAN';
        const status  = idx.status >= 0 ? String(row[idx.status] ||'').trim() : '운영중';
        const note    = idx.note   >= 0 ? String(row[idx.note]   ||'').trim() : '';
        if (!name || !biz_no) continue;

        const payload = {
          name, biz_no, phone, address,
          type:   validTypes.includes(type)    ? type   : 'VAN',
          status: validStatus.includes(status) ? status : '운영중',
          note
        };

        const existingId = existingMap[normalize(biz_no)];
        if (existingId) {
          const { error } = await db.from('merchants').update(payload).eq('id', existingId);
          if (error) errors++; else updated++;
        } else {
          const { error } = await db.from('merchants').insert(payload);
          if (error) errors++; else added++;
        }
        showProgress(updated + added + errors, dataRows.length);
      }

      await renderMerchants();
      toast('완료! 업데이트 ' + updated + '건 / 추가 ' + added + '건' + (errors > 0 ? ' / 오류 ' + errors + '건' : ''), errors > 0 ? 'error' : 'success');
    } catch(err) {
      toast('오류: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

    ['PG','PG 단말기 가맹점'],['VAN+PG','VAN과 PG 모두 사용'],['',''],
    ['[상태] 입력값',''],['운영중','현재 정상 운영 중'],['계약중','계약 진행 중'],['해지','계약 해지된 가맹점'],
    ['',''],['[사업자번호] 형식',''],['예시','123-45-67890'],['주의','이 값이 기준키입니다. 정확히 입력하세요.'],
  ]);
  ws2['!cols'] = [{wch:22},{wch:35}];
  XLSX.utils.book_append_sheet(wb, ws2, '입력가이드');
  XLSX.writeFile(wb, '가맹점_업데이트_양식_' + today() + '.xlsx');

// localStorage 키
const OP_STORAGE_KEY = 'dns_operation_checklist';

function opLoadState() {
  try { return JSON.parse(localStorage.getItem(OP_STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function opSaveState(state) {
  try { localStorage.setItem(OP_STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function opToggle(month, weekIdx, itemIdx) {
  const state = opLoadState();
  const key = month + '_' + weekIdx + '_' + itemIdx;
  state[key] = !state[key];
  opSaveState(state);
  renderOperation();
}

// 현재 월 계산
function getCurrentMonth() {
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  return months[new Date().getMonth()];
}

// 이번 주 할 일 가져오기 (업무 현황 연동용)
function getThisWeekTasks() {
  const month = window._opCurrentMonth || getCurrentMonth();
  const data = OPERATION_DATA[month];
  if (!data) return [];
  const state = opLoadState();
  // 현재 주차 계산 (간단히 날짜 기준)
  const day = new Date().getDate();
  const weekIdx = Math.min(Math.floor((day-1)/7), data.weeks.length-1);
  const week = data.weeks[weekIdx];
  if (!week) return [];
  return week.items.map((item, i) => ({
    ...item,
    done: state[month + '_' + weekIdx + '_' + i] !== undefined ? state[month + '_' + weekIdx + '_' + i] : item.done,
    weekLabel: week.label,
    month
  })).filter(item => !item.done);
}

let _opCurrentMonth = null;

function renderOperation() {
  const contentEl = document.getElementById('content');
  const months = ['7월','8월','9월','10월','11월','12월'];
  const curMonth = _opCurrentMonth || getCurrentMonth();
  if (!months.includes(curMonth)) _opCurrentMonth = '7월';
  const month = _opCurrentMonth || '7월';
  const data = OPERATION_DATA[month];
  const state = opLoadState();

  // 탭
  let html = '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">';
  months.forEach(m => {
    const mData = OPERATION_DATA[m];
    const total = mData.weeks.reduce((s,w)=>s+w.items.length,0);
    const done = mData.weeks.reduce((s,w,wi)=>s+w.items.filter((_,ii)=>state[m+'_'+wi+'_'+ii]!==undefined?state[m+'_'+wi+'_'+ii]:false).length,0);
    const isActive = m === month;
    const isCurrent = m === getCurrentMonth();
    html += '<div onclick="setOpMonth(&quot;' + m + '&quot;)" style="padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:' +
      (isActive ? '2px solid #1F3864;background:#1F3864;color:#fff;' : isCurrent ? '2px solid #C6F432;background:#fff;color:#1F3864;font-weight:600;' : '1px solid #e8e8e4;background:#fff;color:#888;') + '">' +
      m + (done > 0 ? ' (' + done + '/' + total + ')' : '') + '</div>';
  });
  html += '</div>';

  // 목표 배너
  html += '<div style="background:#1F3864;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;">' +
    '<div>' +
      '<div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:3px;">' + month + ' 핵심 테마</div>' +

      '<div style="font-size:11px;color:#C6F432;margin-top:4px;">목표: ' + data.goal + '</div>' +
    '</div>';

  // 진행률
  const allTotal = data.weeks.reduce((s,w)=>s+w.items.length,0);
  const allDone  = data.weeks.reduce((s,w,wi)=>s+w.items.filter((_,ii)=>state[month+'_'+wi+'_'+ii]!==undefined?state[month+'_'+wi+'_'+ii]:data.weeks[wi].items[ii].done).length,0);
  const pct = allTotal > 0 ? Math.round(allDone/allTotal*100) : 0;
  html += '<div style="text-align:right;">' +
    '<div style="font-size:22px;font-weight:700;color:#C6F432;">' + pct + '%</div>' +
    '<div style="font-size:10px;color:rgba(255,255,255,.5);">' + allDone + ' / ' + allTotal + ' 완료</div>' +
    '<div style="width:80px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:6px;">' +
      '<div style="width:' + pct + '%;height:4px;background:#C6F432;border-radius:2px;"></div>' +
    '</div>' +
  '</div></div>';

  html += '<div style="display:grid;grid-template-columns:1fr 300px;gap:14px;">';
  html += '<div>'; // 왼쪽: 주차별 체크리스트

  data.weeks.forEach((week, wi) => {
    const wDone = week.items.filter((_,ii)=>{
      const s = state[month+'_'+wi+'_'+ii];
      return s !== undefined ? s : week.items[ii].done;
    }).length;
    const wAll = week.items.length;
    const allWeekDone = wDone === wAll;

    html += '<div class="card" style="margin-bottom:12px;">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">' +
      '<div style="font-size:12px;font-weight:600;color:#1F3864;">' + week.label + (allWeekDone ? ' ✅' : '') + '</div>' +
      '<span style="font-size:11px;color:#888;">' + wDone + ' / ' + wAll + '</span>' +
    '</div>';
    html += '<div style="height:3px;background:#f0f0ee;border-radius:2px;margin-bottom:10px;"><div style="height:3px;width:' + Math.round(wDone/wAll*100) + '%;background:#C6F432;border-radius:2px;"></div></div>';

    week.items.forEach((item, ii) => {
      const isDone = state[month+'_'+wi+'_'+ii] !== undefined ? state[month+'_'+wi+'_'+ii] : item.done;
      const tagHtml = item.tag === 'sys' ? '<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:#e8ecf5;color:#1F3864;margin-left:4px;">시스템</span>' :
        item.tag === 'biz' ? '<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:#f0fad0;color:#3a6000;margin-left:4px;">영업</span>' :
        item.tag === 'urgent' ? '<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:#feeaea;color:#b91c1c;margin-left:4px;">긴급</span>' :
        item.tag === 'dorder' ? '<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:#f3e8ff;color:#6b21a8;margin-left:4px;">디오더</span>' : '';

      html += '<div onclick="opToggle(&quot;' + month + '&quot;,' + wi + ',' + ii + ')" style="display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #fafaf8;cursor:pointer;">' +
        '<div style="width:16px;height:16px;border:' + (isDone?'none':'1.5px solid #ddd') + ';border-radius:4px;flex-shrink:0;margin-top:1px;background:' + (isDone?'#C6F432':'#fff') + ';display:flex;align-items:center;justify-content:center;">' +
          (isDone ? '<svg width="10" height="8" viewBox="0 0 10 8"><path d="M1 4l3 3 5-6" stroke="#1F3864" stroke-width="1.8" fill="none"/></svg>' : '') +
        '</div>' +
        '<div style="font-size:12px;color:' + (isDone?'#aaa':'#333') + ';text-decoration:' + (isDone?'line-through':'none') + ';line-height:1.5;flex:1;">' + item.text + tagHtml + '</div>' +
      '</div>';
    });
    html += '</div>';
  });

  html += '</div>'; // 왼쪽 끝

  // 오른쪽: 이번 주 할 일 + 하반기 목표
  html += '<div>';

  // 이번 주 카드
  const day = new Date().getDate();
  const weekIdx = Math.min(Math.floor((day-1)/7), data.weeks.length-1);
  const thisWeek = data.weeks[weekIdx];
  const thisWeekRemain = thisWeek.items.filter((_,ii) => {
    const s = state[month+'_'+weekIdx+'_'+ii];
    return !(s !== undefined ? s : thisWeek.items[ii].done);
  });

  html += '<div style="background:#fff;border:2px solid #C6F432;border-radius:10px;padding:14px;margin-bottom:12px;">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
      '<div style="font-size:12px;font-weight:600;color:#1F3864;display:flex;align-items:center;gap:6px;">📅 이번 주 할 일</div>' +
      '<span style="background:#C6F432;color:#1F3864;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;">' + thisWeek.label + '</span>' +
    '</div>' +
    '<div style="font-size:10px;color:#888;margin-bottom:8px;">업무 현황 상단에도 함께 표시됩니다</div>';

  if (thisWeekRemain.length === 0) {
    html += '<div style="text-align:center;padding:16px;color:#3a6000;font-size:12px;">✅ 이번 주 모두 완료!</div>';
  } else {
    thisWeekRemain.slice(0,5).forEach(item => {
      const tagHtml = item.tag === 'sys' ? '<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:#e8ecf5;color:#1F3864;margin-left:4px;">시스템</span>' :
        item.tag === 'biz' ? '<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:#f0fad0;color:#3a6000;margin-left:4px;">영업</span>' :
        item.tag === 'urgent' ? '<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:#feeaea;color:#b91c1c;margin-left:4px;">긴급</span>' : '';
      html += '<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid #fafaf8;">' +
        '<div style="width:6px;height:6px;border-radius:50%;background:#C6F432;flex-shrink:0;margin-top:4px;"></div>' +
        '<div style="font-size:12px;color:#333;flex:1;">' + item.text + tagHtml + '</div>' +
      '</div>';
    });
    if (thisWeekRemain.length > 5) {
      html += '<div style="font-size:11px;color:#888;text-align:center;padding-top:6px;">외 ' + (thisWeekRemain.length-5) + '건</div>';
    }
  }
  html += '</div>';

  // 하반기 목표
  html += '<div class="card">' +
    '<div class="card-title" style="font-size:12px;font-weight:600;color:#1F3864;margin-bottom:10px;display:flex;align-items:center;gap:6px;"><span style="width:3px;height:13px;background:#C6F432;border-radius:2px;display:inline-block;"></span>하반기 핵심 목표</div>' +
    '<div style="font-size:12px;line-height:2;color:#555;">' +
      '<div>9월 말 — 월매출 <strong style="color:#1F3864;">600~700만</strong></div>' +
      '<div>12월 말 — 월매출 <strong style="color:#1F3864;">800~1,000만</strong></div>' +
      '<div>키오스크 — <strong style="color:#1F3864;">3~5대</strong></div>' +
      '<div>F&B 가맹점 — <strong style="color:#1F3864;">3~5곳</strong></div>' +
      '<div>디오더 런칭 — <strong style="color:#1F3864;">12월 1주차</strong></div>' +
    '</div>' +
  '</div>';

  html += '</div>'; // 오른쪽 끝
  html += '</div>'; // 그리드 끝

  contentEl.innerHTML = html;
}

function deliveryStatusBadge(s) {
  const m = { '요청접수':'badge-gray','재고확인':'badge-blue','준비중':'badge-amber','발송완료':'badge-green' };
  return '<span class="badge ' + (m[s]||'badge-gray') + '">' + s + '</span>';
}

function monthSelector(currentMonth, onChangeFn) {
  const months = [];
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(d.toISOString().slice(0,7));
  }
  return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">' +
    '<span style="font-size:12px;color:#888;">월 선택:</span>' +
    '<select class="form-select" style="width:140px;" onchange="' + onChangeFn + '(this.value)">' +
    '<option value="">전체</option>' +
    months.map(m => '<option value="' + m + '" ' + (currentMonth===m?'selected':'') + '>' + m + '</option>').join('') +
    '</select></div>';
}

let _deliveryMonth = new Date().toISOString().slice(0,7);

async function renderDelivery() {
  const contentEl = document.getElementById('content');
  try {
    let query = db.from('deliveries').select('*').neq('status','발송완료').order('created_at', { ascending: false });
    const { data, error } = await query;
    if (error) throw error;
    window._deliveries = data || [];
    document.getElementById('badge-delivery').textContent = window._deliveries.length;

    // 이번달 발송완료 통계
    const { data: monthData } = await db.from('deliveries')
      .select('*').eq('status','발송완료')
      .gte('shipped_date', _deliveryMonth + '-01')
      .lte('shipped_date', _deliveryMonth + '-31');
    const monthDone = monthData || [];
    const totalFee = monthDone.reduce((s,d)=>s+(d.shipping_fee||0),0);
    const directCount = monthDone.filter(d=>d.courier==='직접 배송').length;

    let html = monthSelector(_deliveryMonth, 'setDeliveryMonth');

    html += '<div class="flow-steps" style="margin-bottom:16px;">' +

function toggleDeliveryReceiverSearch(type) {
  const searchWrap = document.getElementById('dv-search-wrap');
  const searchInput = document.getElementById('dv-merchant-search');
  if (type === '가맹점') {
    searchWrap.style.display = 'block';
    if (searchInput) searchInput.placeholder = '가맹점명 입력 후 선택...';
  } else if (type === '대리점') {
    searchWrap.style.display = 'block';
    if (searchInput) { searchInput.placeholder = '대리점명 직접 입력'; searchInput.value = ''; }
    document.getElementById('dv-merchant').value = '';
    document.getElementById('dv-addr').value = '';
    document.getElementById('dv-merchant-dropdown').style.display = 'none';
  } else {
    searchWrap.style.display = 'none';
    document.getElementById('dv-merchant').value = '';
    document.getElementById('dv-addr').value = '';
  }
}

function searchDeliveryMerchant(q) {
  const dd = document.getElementById('dv-merchant-dropdown');
  if (!q.trim()) { dd.style.display = 'none'; return; }
  const type = document.getElementById('dv-recv-type')?.value || '가맹점';
  if (type !== '가맹점') {
    dd.style.display = 'none';
    document.getElementById('dv-merchant').value = q;
    return;
  }
  const merchants = window._merchants || [];
  const filtered = merchants.filter(m =>
    m.name.toLowerCase().includes(q.toLowerCase()) ||
    (m.biz_no||'').includes(q)
  ).slice(0, 10);
  if (filtered.length === 0) { dd.style.display = 'none'; return; }
  const items = filtered.map((m, i) => {
    const div = document.createElement('div');
    div.style.cssText = 'padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0ee;';
    div.innerHTML = '<strong>' + m.name + '</strong><span style="color:#888;font-size:11px;margin-left:8px;">' + (m.biz_no||'') + '</span>';
    div.onmousedown = () => selectDeliveryMerchant(m);
    div.onmouseover = () => div.style.background = '#f0fad0';
    div.onmouseout = () => div.style.background = '';
    return div;
  });
  dd.innerHTML = '';
  items.forEach(el => dd.appendChild(el));
  dd.style.display = 'block';
}

function selectDeliveryMerchant(m) {
  document.getElementById('dv-merchant-search').value = m.name;
  document.getElementById('dv-merchant').value = m.name;
  document.getElementById('dv-addr').value = m.address || '';
  document.getElementById('dv-merchant-dropdown').style.display = 'none';
}

function hideDropdown() {
  const dd = document.getElementById('dv-merchant-dropdown');
  if (dd) dd.style.display = 'none';
}

// 공통 가맹점 검색 (CS/업무용)
function searchMerchantFor(q, dropdownId, nameInputId, addrInputId) {
  const dd = document.getElementById(dropdownId);
  if (!dd) return;
  if (!q.trim()) { dd.style.display = 'none'; return; }
  const merchants = window._merchants || [];
  const filtered = merchants.filter(m =>
    m.name.toLowerCase().includes(q.toLowerCase()) ||
    (m.biz_no||'').includes(q)
  ).slice(0, 10);
  if (filtered.length === 0) { dd.style.display = 'none'; return; }
  dd.innerHTML = '';
  filtered.forEach(m => {
    const div = document.createElement('div');
    div.style.cssText = 'padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0ee;';
    div.innerHTML = '<strong>' + m.name + '</strong><span style="color:#888;font-size:11px;margin-left:8px;">' + (m.biz_no||'') + '</span>';
    div.onmousedown = () => {
      const nameEl = document.getElementById(nameInputId);
      const addrEl = document.getElementById(addrInputId);
      if (nameEl) nameEl.value = m.name;
      if (addrEl) addrEl.value = m.address || '';
      dd.style.display = 'none';
      const searchEl = dd.previousElementSibling;
      if (searchEl) searchEl.value = m.name;
    };
    div.onmouseover = () => div.style.background = '#f0fad0';
    div.onmouseout = () => div.style.background = '';
    dd.appendChild(div);
  });
  dd.style.display = 'block';
}

function hideMerchantDropdown(dropdownId) {
  setTimeout(() => {
    const dd = document.getElementById(dropdownId);
    if (dd) dd.style.display = 'none';
  }, 200);
}

async function openAddDelivery() {
  if (!window._merchants || window._merchants.length === 0) {
    const { data } = await db.from('merchants').select('id, name, address').order('name');
    window._merchants = (data||[]).slice().sort((a,b) => a.name.localeCompare(b.name,'ko'));
  }
  openModal('배송 등록', deliveryForm(), async () => {
    const merchant_name = v('dv-merchant');
    const item_name = v('dv-item');
    if (!merchant_name || !item_name) return toast('가맹점명과 품목을 입력해주세요.', 'error');
    const { error } = await db.from('deliveries').insert({
      delivery_no: genNo('DEL'),
      receiver_type: v('dv-recv-type') || '가맹점',
      merchant_name, merchant_addr: v('dv-addr'),
      item_name, quantity: v('dv-qty'), status: v('dv-status'), manager: v('dv-manager'),
      courier: v('dv-courier'), tracking_no: v('dv-tracking'),
      shipping_fee: parseInt(v('dv-fee'))||0,
      request_date: v('dv-reqdate') || today(),
      shipped_date: v('dv-shipdate') || null,
      note: v('dv-note')
    });
    if (error) return toast('저장 실패: ' + error.message, 'error');
    toast('배송이 등록되었습니다.'); closeModal(); renderDelivery();
  });
}

function openEditDelivery(id) {
  const all = [...(window._deliveries||[]), ...(window._allDeliveries||[])];
  const d = all.find(x => x.id === id);
  if (!d) return;
  openModal('배송 편집', deliveryForm(d), async () => {
    const { error } = await db.from('deliveries').update({
      receiver_type: v('dv-recv-type') || '가맹점',
      merchant_name: v('dv-merchant'), merchant_addr: v('dv-addr'),
      item_name: v('dv-item'), quantity: v('dv-qty'),
      status: v('dv-status'), manager: v('dv-manager'),
      courier: v('dv-courier'), tracking_no: v('dv-tracking'),
      shipping_fee: parseInt(v('dv-fee'))||0,
      request_date: v('dv-reqdate') || today(),
      shipped_date: v('dv-shipdate') || null,
      note: v('dv-note')
    }).eq('id', id);
    if (error) return toast('저장 실패: ' + error.message, 'error');
    toast('수정되었습니다.'); closeModal();
    if ((window._deliveries||[]).find(x=>x.id===id)) renderDelivery();
    else renderDeliveryHistory();
  });
}

async function completeDelivery(id) {
  const d = (window._deliveries||[]).find(x=>x.id===id);
  const { error } = await db.from('deliveries').update({ status: '발송완료', shipped_date: today() }).eq('id', id);
  if (error) return toast('오류: ' + error.message, 'error');
  if (d) await adjustInventoryStock(d.item_name, d.quantity, 'out');
  toast('발송완료 처리되었습니다. 재고가 자동 차감되었습니다.'); renderDelivery();
}

async function deleteDelivery(id) {
  if (!confirm('이 배송 내역을 삭제할까요?')) return;
  const { error } = await db.from('deliveries').delete().eq('id', id);
  if (error) return toast('삭제 실패', 'error');
  toast('삭제되었습니다.');
  if ((window._deliveries||[]).find(x=>x.id===id)) renderDelivery();
  else renderDeliveryHistory();
}

// ── 탭1: 수동 입력 ──────────────────────────
async function renderRevenueManual() {
  try {
    const { data, error } = await db.from('revenue').select('*, merchants(name)').order('month', { ascending: false });
    if (error) throw error;
    window._revenue = data || [];
    const month = thisMonth();
    const thisMonthData = window._revenue.filter(r => r.month === month);
    const totalVan = thisMonthData.reduce((s,r) => s+(r.van_revenue||0), 0);
    const totalPg  = thisMonthData.reduce((s,r) => s+(r.pg_revenue||0), 0);
    const total = totalVan + totalPg;
    const vanPct = total > 0 ? Math.round(totalVan/total*100) : 0;
    let html = '<div class="metrics">' +
      '<div class="metric"><div class="metric-label">이번 달 총 수익</div><div class="metric-value" style="font-size:18px">₩' + total.toLocaleString() + '원</div></div>' +
      '<div class="metric"><div class="metric-label">VAN 수익</div><div class="metric-value" style="font-size:18px">₩' + totalVan.toLocaleString() + '원</div><div class="metric-sub">' + vanPct + '%</div></div>' +
      '<div class="metric"><div class="metric-label">PG 수익</div><div class="metric-value" style="font-size:18px">₩' + totalPg.toLocaleString() + '원</div><div class="metric-sub">' + (100-vanPct) + '%</div></div>' +
      '<div class="metric"><div class="metric-label">입력 건수</div><div class="metric-value">' + thisMonthData.length + '건</div></div>' +
      '</div>';
    html += '<div class="card"><div class="card-header"><div class="card-title">매출 내역</div>' +
      '<button class="btn btn-sm btn-excel" onclick="exportRevenueExcel()">📊 엑셀 저장</button></div>';
    if (window._revenue.length === 0) { html += emptyState('매출 내역이 없습니다.'); }
    else {
      html += '<table><thead><tr><th>월</th><th>가맹점</th><th>가맹점 매출</th><th>VAN 수익</th><th>PG 수익</th><th>메모</th><th></th></tr></thead><tbody>';
      window._revenue.forEach(r => {
        html += '<tr><td>' + r.month + '</td><td>' + (r.merchants?.name||'-') + '</td>' +
          '<td>₩' + (r.merchant_sales||0).toLocaleString() + '원</td>' +
          '<td style="color:#0a6644">₩' + (r.van_revenue||0).toLocaleString() + '원</td>' +
          '<td style="color:#1a56a0">₩' + (r.pg_revenue||0).toLocaleString() + '원</td>' +
          '<td style="color:#888">' + (r.note||'-') + '</td>' +
          '<td><button class="btn btn-sm btn-danger" onclick="deleteRevenue(' + r.id + ')">삭제</button></td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    document.getElementById('revenue-tab-content').innerHTML = html;
  } catch(e) { document.getElementById('revenue-tab-content').innerHTML = dbError(e); }
}

// Supabase에서 특정 월 정산 데이터 불러와 화면 렌더
async function loadKisFromSupabase(month) {
  if (!month) return;
  document.getElementById('kis-result').innerHTML =
    '<div style="text-align:center;padding:30px;color:#888">⏳ ' + month + ' 데이터 불러오는 중...</div>';
  try {
    const { data, error } = await db.from('kis_settlement')
      .select('*').eq('month', month).order('fee_total', { ascending: false });
    if (error) throw error;
    if (!data || data.length === 0) {
      document.getElementById('kis-result').innerHTML =
        '<div style="text-align:center;padding:30px;color:#888">' + month + ' 저장된 데이터가 없어요.</div>';
      return;
    }

    // renderKisResult 형식으로 변환
    const results = data.map(r => ({
      name: r.merchant_name, biz_no: r.biz_no,
      approval: r.approval_count, desc: r.desc_count, cash: r.cash_count,
      avg: r.avg_amount, monthly: r.monthly_amount,
      feeVan: r.fee_van, feeDesc: r.fee_desc, feeCash: r.fee_cash,
      total: r.fee_total
    }));
    const totalVan  = data.reduce((s,r) => s+(r.fee_van||0), 0);
    const totalDesc = data.reduce((s,r) => s+(r.fee_desc||0), 0);
    const totalCash = data.reduce((s,r) => s+(r.fee_cash||0), 0);
    const grandTotal = totalVan + totalDesc + totalCash;

    const kisData = { results, totalVan, totalDesc, totalCash, grandTotal, analysisMonth: month };
    window._kisResult = kisData;  // 저장 버튼이 작동하도록 _kisResult 세팅
    renderKisResult(kisData);
  } catch(e) {
    document.getElementById('kis-result').innerHTML =
      '<div class="card" style="padding:20px;color:red">❌ 불러오기 실패: ' + e.message + '</div>';
  }
}

async function runKisAnalysis() {
  const fAgency = document.getElementById('kis-file-agency').files[0];
  const fPerf   = document.getElementById('kis-file-perf').files[0];
  const fRate   = document.getElementById('kis-file-rate').files[0];
  if (!fAgency || !fPerf || !fRate) return toast('①~③ 3개 파일을 모두 업로드해주세요.', 'error');

  document.getElementById('kis-result').innerHTML = '<div style="text-align:center;padding:40px;color:#888">⏳ 분석 중...</div>';

  try {
    // 파일 읽기 헬퍼
    const readHtml = f => new Promise((res,rej) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.onerror = rej;
      r.readAsText(f, 'EUC-KR');
    });
    const readBinary = f => new Promise((res,rej) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.onerror = rej;
      r.readAsBinaryString(f);
    });

    // ── 1. 대리점 수수료 파싱 (9780+BKY0 등 전체 대리점 합계) ──
    // 모든 테이블의 모든 23컬럼 행을 수집 후 cells[22](총합계)가 가장 큰 단 하나의 행 선택
    const agencyHtml = await readHtml(fAgency);
    const agencyDoc = new DOMParser().parseFromString(agencyHtml, 'text/html');
    const agencyTables = agencyDoc.querySelectorAll('table');
    let totalVan = 0, totalDesc = 0, totalCash = 0;

    const seen = new Set();
    let bestTotal = 0, bestRow = null;
    for (const tbl of agencyTables) {
      for (const row of tbl.querySelectorAll('tr')) {
        const cells = [...row.querySelectorAll('td,th')].map(c => c.textContent.trim()).filter(c=>c);
        if (cells.length !== 23) continue;
        const key = cells.join('|');
        if (seen.has(key)) continue;
        seen.add(key);
        const n = s => parseInt(s.replace(/,/g,'').replace(/-/g,'0'))||0;
        const rowTotal = n(cells[22]);
        if (rowTotal > bestTotal) { bestTotal = rowTotal; bestRow = cells; }
      }
    }
    if (bestRow) {
      const n = s => parseInt(s.replace(/,/g,'').replace(/-/g,'0'))||0;
      totalVan  = n(bestRow[4]);
      totalDesc = n(bestRow[15]);
      totalCash = n(bestRow[21]);
    }
    document.getElementById('kis-agency-status').textContent =
      bestTotal > 0
        ? '✅ 유상후불 ₩' + totalVan.toLocaleString() + ' / DESC ₩' + totalDesc.toLocaleString() + ' / 현금 ₩' + totalCash.toLocaleString()
        : '❌ 합계 행을 찾지 못했습니다';

    // ── 2. 사업자정률실적조회 파싱 (9780+BKY0 등 전체 가맹점 통합, 진짜 xlsx) ──
    const perfBin = await readBinary(fPerf);
    const perfWb  = XLSX.read(perfBin, { type: 'binary' });
    const perfWs  = perfWb.Sheets[perfWb.SheetNames[0]];
    const perfArr = XLSX.utils.sheet_to_json(perfWs, { header:1, defval:'' });
    // 데이터 행: 첫 컬럼(NO)이 숫자이고 가맹점명(인덱스7)이 있는 행
    const perfRows = perfArr.filter(r => r[0] !== '' && !isNaN(parseInt(r[0])) && r[7]);

    // 사업자번호(biz_no) 기준 그룹핑 — 단, 확인된 동일 사업자 6곳만 병합
    // (광명캠퍼스/크레오어학원광명캠퍼스는 브랜드명이 달라 병합 제외, 나머지는 이름 그대로 유지)
    const MERGE_BIZ_WHITELIST = new Set([
      '1389106141', // 최선어학원평촌고등관학원 (+ 디와이비최선고등관학원)
      '1249476877', // 최선어학원 수원캠퍼스 (+ 최선어학원수원정자캠퍼스)
      '1389056488', // 디와이비 최선어학원초중등평촌 (+ 디와이비 최선어학원)
      '1359137534', // 최선어학원 수지캠퍼스 (+ 수지캠퍼스초등관 등)
      '1209070515', // 최선어학원 일산캠퍼스
      '1058622701', // (주) 오투라인
    ]);
    const merchantMap = {};
    perfRows.forEach(r => {
      const name   = String(r[7]).trim();
      const bizRaw = String(r[4]||'').replace(/-/g,'').trim();
      const count  = parseFloat(r[9])  || 0;
      const amount = parseFloat(r[10]) || 0;
      // 화이트리스트에 있는 사업자만 biz_no로 병합, 그 외는 이름 그대로 개별 유지
      const key = (bizRaw && MERGE_BIZ_WHITELIST.has(bizRaw)) ? bizRaw : ('NAME_' + name);
      if (!merchantMap[key]) {
        merchantMap[key] = { name, biz_no: bizRaw, approval: 0, monthly: 0, nameAmounts: {} };
      }
      merchantMap[key].approval += count;
      merchantMap[key].monthly  += amount;
      merchantMap[key].nameAmounts[name] = (merchantMap[key].nameAmounts[name] || 0) + amount;
    });
    const merchantList = Object.values(merchantMap).map(m => {
      const bestName = Object.entries(m.nameAmounts).sort((a,b) => b[1]-a[1])[0][0];
      return { name: bestName, biz_no: m.biz_no, approval: m.approval, monthly: m.monthly };
    });
    document.getElementById('kis-perf-status').textContent = '✅ ' + merchantList.length + '개 가맹점 (' + perfRows.length + '개 단말기) 로드';


    // ── 3. 유상후불 지급율표 파싱 ──
    const rateBin = await readBinary(fRate);
    const rateWb  = XLSX.read(rateBin, { type: 'binary' });
    const rateWs  = rateWb.Sheets[rateWb.SheetNames[0]];
    const rateArr = XLSX.utils.sheet_to_json(rateWs, { header:1, defval:'' });
    const rateRanges = rateArr[0].slice(2);
    const amountTable = [];
    for (let i = 2; i < rateArr.length; i++) {
      const row = rateArr[i];
      if (!row[0]) continue;
      try {
        const lo = parseFloat(row[0]), hi = row[1] ? parseFloat(row[1]) : Infinity;
        const profits = row.slice(2, 2+rateRanges.length).map(x => parseFloat(x)||0);
        amountTable.push({ lo, hi, profits });
      } catch(e) {}
    }
    document.getElementById('kis-rate-status').textContent = '✅ ' + amountTable.length + '개 구간 로드';

    function findRateCol(rate) {
      for (let i = 0; i < rateRanges.length; i++) {
        try {
          const parts = String(rateRanges[i]).replace('이상','~9999').split('~');
          const lo = parseFloat(parts[0]), hi = parts[1] ? parseFloat(parts[1]) : 9999;
          if (lo <= rate && rate < hi) return i;
        } catch(e) {}
      }
      return rateRanges.length - 1;
    }
    function findAmountRow(avg) {
      for (let i = 0; i < amountTable.length; i++) {
        if (amountTable[i].lo <= avg && avg < amountTable[i].hi) return i;
      }
      return amountTable.length - 1;
    }

    // ── 4. 가맹점별 수익 계산 ──
    // 방식: 지급율표로 가맹점별 '상대적 비중(raw)'을 구하고,
    //       실제 총액(Agency 파일 grand total)에 비율 배분 → 총액은 항상 정확히 일치
    const RATE = 1.51; // 평균 가수율 (KIS 사이트 표시값)
    const rateCol = findRateCol(RATE);

    const raw = merchantList.map(m => {
      if (m.approval <= 0) return 0;
      const avg = m.monthly / m.approval;
      const ri = findAmountRow(avg);
      const profitPerTx = (amountTable[ri]?.profits[rateCol] || 0) * avg;
      return profitPerTx * m.approval;
    });
    const totalRaw = raw.reduce((s,v)=>s+v, 0);
    const totalApproval = merchantList.reduce((s,m)=>s+m.approval, 0);
    const descPerTx = totalApproval > 0 ? totalDesc / totalApproval : 0; // 건수 비율 근사 배분
    const cashPerTx = totalApproval > 0 ? totalCash / totalApproval : 0;

    const results = merchantList.map((m, i) => {
      const feeVan  = totalRaw > 0 ? (raw[i] / totalRaw * totalVan) : 0;
      const feeDesc = m.approval * descPerTx;
      const feeCash = m.approval * cashPerTx;
      return {
        name: m.name, biz_no: m.biz_no,
        approval: Math.round(m.approval), desc: 0, cash: 0,
        avg: m.approval > 0 ? Math.round(m.monthly / m.approval) : 0,
        monthly: m.monthly,
        feeVan, feeDesc, feeCash,
        total: feeVan + feeDesc + feeCash
      };
    }).sort((a,b) => b.total - a.total);

    const grandTotal = totalVan + totalDesc + totalCash;
    const analysisMonth = document.getElementById('kis-month').value;
    if (!analysisMonth) return toast('정산 월을 선택해주세요.', 'error');

    window._kisResult = { results, totalVan, totalDesc, totalCash, grandTotal, analysisMonth };
    renderKisResult(window._kisResult);

  } catch(e) {
    document.getElementById('kis-result').innerHTML = '<div class="card" style="padding:20px;color:red">❌ 분석 오류: ' + e.message + '</div>';
    console.error(e);
  }
}

function closeUnmatchedCard() {
  window._kisUnmatched = null;
  if (window._kisResult) renderKisResult(window._kisResult);
  else if (window._kisViewMonth) loadKisFromSupabase(window._kisViewMonth);
}

  const { results, totalVan, totalDesc, totalCash, grandTotal, analysisMonth } = data;
  const valid = results.filter(r => r.total > 0);
  const top5  = valid.slice(0, 5);

  // 미매칭 가맹점 카드 (저장 직후에만 표시됨)
  const unmatched = window._kisUnmatched || [];
  let unmatchedHtml = '';
  if (unmatched.length > 0) {
    unmatchedHtml = `
    <div class="card" style="margin-top:16px;border:1px solid #f0d080;background:#fffdf5">
      <div class="card-header">
        <div class="card-title" style="color:#92400e">⚠ 미매칭 가맹점 (${unmatched.length}곳) — 가맹점 관리에 반영 안 됨</div>
        <button class="btn btn-sm" onclick="closeUnmatchedCard()">닫기</button>
