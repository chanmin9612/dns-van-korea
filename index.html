<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>디앤에스밴코리아 관리 시스템</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:14px;}

/* Layout */
.app{display:flex;height:100vh;}
.sidebar{width:210px;min-width:210px;background:#fff;border-right:1px solid #e8e8e4;display:flex;flex-direction:column;overflow-y:auto;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.content{flex:1;overflow-y:auto;padding:24px;}

/* Sidebar */
.sidebar{background:#16213e !important;border-right:none !important;}
.sidebar-header{padding:24px 18px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo-mark{width:32px;height:32px;background:linear-gradient(135deg,#4f8ef7,#1a56d6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;margin-bottom:12px;letter-spacing:-.5px;}
.sidebar-company{font-size:13px;font-weight:600;color:#fff;line-height:1.4;}
.sidebar-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:3px;}
.nav-section{padding:16px 18px 5px;font-size:10px;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13px;color:rgba(255,255,255,.6);cursor:pointer;border-radius:0;transition:all .12s;margin:1px 0;}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9);}
.nav-item.active{background:rgba(79,142,247,.18);color:#4f8ef7;font-weight:500;border-right:2px solid #4f8ef7;}
.nav-item .icon{font-size:15px;width:18px;text-align:center;opacity:.8;}

/* Topbar */
.topbar{background:#fff;border-bottom:1px solid #e8e8e4;padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-size:15px;font-weight:600;color:#1a1a1a;}
.topbar-actions{display:flex;align-items:center;gap:8px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:13px;font-family:inherit;border:1px solid #ddd;border-radius:7px;background:#fff;color:#333;cursor:pointer;transition:all .12s;}
.btn:hover{background:#f5f5f3;border-color:#ccc;}
.btn-primary{background:#0a6644;color:#fff;border-color:#0a6644;}
.btn-primary:hover{background:#085538;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-danger{border-color:#e44;color:#c33;}
.btn-danger:hover{background:#fff5f5;}

/* Cards */
.card{background:#fff;border:1px solid #e8e8e4;border-radius:10px;padding:18px;margin-bottom:16px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:600;color:#1a1a1a;}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.metric{background:#fff;border:1px solid #e8e8e4;border-radius:10px;padding:16px;}
.metric-label{font-size:11px;color:#888;margin-bottom:8px;font-weight:500;}
.metric-value{font-size:24px;font-weight:600;color:#1a1a1a;}
.metric-sub{font-size:11px;color:#aaa;margin-top:4px;}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;padding:9px 12px;color:#888;font-weight:500;border-bottom:1px solid #e8e8e4;font-size:12px;white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid #f0f0ee;color:#1a1a1a;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:#fafaf8;}

/* Badges */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;}
.badge-green{background:#e8f5ee;color:#0a6644;}
.badge-amber{background:#fff4e0;color:#a05c00;}
.badge-blue{background:#e8f0fb;color:#1a56a0;}
.badge-red{background:#feeaea;color:#b91c1c;}
.badge-gray{background:#f0f0ee;color:#555;}
.badge-teal{background:#e0f5f0;color:#0a7a60;}

/* Flow steps */
.flow-steps{display:flex;margin-bottom:20px;}
.flow-step{flex:1;text-align:center;padding:9px 6px;font-size:12px;color:#aaa;background:#f5f5f3;border:1px solid #e8e8e4;position:relative;cursor:default;}
.flow-step:not(:last-child){margin-right:-1px;}
.flow-step:not(:last-child)::after{content:'›';position:absolute;right:-8px;top:50%;transform:translateY(-50%);color:#ccc;font-size:16px;z-index:1;}
.flow-step:first-child{border-radius:7px 0 0 7px;}
.flow-step:last-child{border-radius:0 7px 7px 0;}
.flow-step.done{background:#e8f5ee;color:#0a6644;border-color:#b5ddc8;}
.flow-step.active{background:#e8f0fb;color:#1a56a0;border-color:#b5cff5;font-weight:500;}

/* Form */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;color:#666;margin-bottom:5px;font-weight:500;}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 11px;font-size:13px;font-family:inherit;border:1px solid #ddd;border-radius:7px;background:#fff;color:#1a1a1a;outline:none;transition:border-color .12s;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#0a6644;}
.form-textarea{min-height:72px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:1000;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:12px;padding:24px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-title{font-size:15px;font-weight:600;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid #e8e8e4;}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:2000;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:#0a6644;}
.toast.error{background:#b91c1c;}

/* Bar chart */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-label{font-size:12px;color:#888;width:36px;}
.bar-track{flex:1;height:8px;background:#f0f0ee;border-radius:4px;overflow:hidden;}
.bar-fill{height:8px;border-radius:4px;transition:width .3s;}
.bar-value{font-size:12px;color:#888;width:56px;text-align:right;}

/* Grid helpers */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

/* Page */
.page{display:none;}
.page.active{display:block;}

/* Empty state */
.empty-state{text-align:center;padding:48px 24px;color:#aaa;}
.empty-state .es-icon{font-size:36px;margin-bottom:12px;}
.empty-state .es-text{font-size:14px;}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:48px;color:#aaa;font-size:13px;gap:8px;}

/* Revenue split */
.rev-split{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0;}
.rev-van{background:#0a6644;}
.rev-pg{background:#1a56a0;}

/* Delete confirm */
.delete-confirm{background:#fff5f5;border:1px solid #fca5a5;border-radius:8px;padding:12px;font-size:13px;color:#b91c1c;margin-bottom:14px;}
.btn-excel{background:#fff;color:#1a6b3c;border-color:#b5ddc8;}
.btn-excel:hover{background:#e8f5ee;}
.btn-pdf{background:#fff;color:#b91c1c;border-color:#fca5a5;}
.btn-pdf:hover{background:#fff5f5;}
</style>
</head>
<body>

<div class="app">
<!-- Sidebar -->
<nav class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo-mark">D&S</div>
    <div class="sidebar-company">디앤에스밴코리아</div>
    <div class="sidebar-sub">VAN/PG 관리 시스템</div>
  </div>
  <div class="nav-section">메인</div>
  <div class="nav-item active" data-page="dashboard"><span class="icon">📊</span>대시보드</div>
  <div class="nav-section">단말기</div>
  <div class="nav-item" data-page="terminals"><span class="icon">📟</span>단말기 관리</div>
  <div class="nav-item" data-page="orders"><span class="icon">📦</span>발주 관리</div>
  <div class="nav-item" data-page="inventory"><span class="icon">🗄️</span>재고 현황</div>
  <div class="nav-section">가맹점</div>
  <div class="nav-item" data-page="merchants"><span class="icon">🏪</span>가맹점 관리</div>
  <div class="nav-item" data-page="installs"><span class="icon">🔧</span>설치/회수 이력</div>
  <div class="nav-section">정산</div>
  <div class="nav-item" data-page="revenue"><span class="icon">💰</span>매출/정산</div>
</nav>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">대시보드</div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </div>
  <div class="content" id="content">
    <!-- Pages rendered by JS -->
  </div>
</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">추가</div>
      <button class="btn btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="modal-save-btn">저장</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// =============================================
// SUPABASE 설정
// =============================================
const SUPABASE_URL = 'https://maqsveskwhtoqqeysnca.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hcXN2ZXNrd2h0b3FxZXlzbmNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NzUyNDAsImV4cCI6MjA5NjU1MTI0MH0.CJAVzPPsWiRhgJS3aaMxdsA3L176jhO2KJnMg9ZOlwQ';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// =============================================
// STATE
// =============================================
let currentPage = 'dashboard';
let modalSaveHandler = null;

// =============================================
// NAV
// =============================================
const pageConfig = {
  dashboard: { title: '대시보드', addBtn: null },
  terminals: { title: '단말기 관리', addBtn: { label: '단말기 추가', fn: openAddTerminal } },
  orders:    { title: '발주 관리',  addBtn: { label: '발주 등록',   fn: openAddOrder } },
  inventory: { title: '재고 현황',  addBtn: null },
  merchants: { title: '가맹점 관리',addBtn: { label: '가맹점 추가', fn: openAddMerchant } },
  installs:  { title: '설치/회수 이력', addBtn: { label: '이력 등록', fn: openAddInstall } },
  revenue:   { title: '매출/정산', addBtn: { label: '매출 입력', fn: openAddRevenue } },
};

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    const page = el.dataset.page;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    loadPage(page);
  });
});

function loadPage(page) {
  currentPage = page;
  const cfg = pageConfig[page];
  document.getElementById('topbar-title').textContent = cfg.title;
  const actions = document.getElementById('topbar-actions');
  actions.innerHTML = '';
  if (cfg.addBtn) {
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.innerHTML = `+ ${cfg.addBtn.label}`;
    btn.onclick = cfg.addBtn.fn;
    actions.appendChild(btn);
  }
  const content = document.getElementById('content');
  content.innerHTML = `<div class="loading">⏳ 불러오는 중...</div>`;
  const renderers = { dashboard: renderDashboard, terminals: renderTerminals, orders: renderOrders,
    inventory: renderInventory, merchants: renderMerchants, installs: renderInstalls, revenue: renderRevenue };
  renderers[page]();
}

// =============================================
// TOAST
// =============================================
function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 2500);
}

// =============================================
// MODAL
// =============================================
function openModal(title, bodyHtml, saveFn) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  modalSaveHandler = saveFn;
  document.getElementById('modal-save-btn').onclick = saveFn;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  modalSaveHandler = null;
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// =============================================
// DASHBOARD
// =============================================
async function renderDashboard() {
  const content = document.getElementById('content');
  try {
    const [{ data: terminals }, { data: merchants }, { data: orders }, { data: revenue }, { data: installs }] = await Promise.all([
      db.from('terminals').select('*'),
      db.from('merchants').select('*'),
      db.from('orders').select('*').order('created_at', { ascending: false }).limit(5),
      db.from('revenue').select('*'),
      db.from('installs').select('*, merchants(name), terminals(name)').order('install_date', { ascending: false }).limit(5),
    ]);

    const totalStock = (terminals || []).reduce((s, t) => s + (t.stock || 0), 0);
    const totalMerchants = (merchants || []).length;
    const thisMonth = new Date().toISOString().slice(0, 7);
    const monthRevenue = (revenue || []).filter(r => r.month === thisMonth);
    const vanRevenue = monthRevenue.reduce((s, r) => s + (r.van_revenue || 0), 0);
    const pgRevenue = monthRevenue.reduce((s, r) => s + (r.pg_revenue || 0), 0);

    content.innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="metric-label">총 단말기 재고</div><div class="metric-value">${totalStock.toLocaleString()}</div><div class="metric-sub">${(terminals||[]).length}종 단말기</div></div>
      <div class="metric"><div class="metric-label">등록 가맹점</div><div class="metric-value">${totalMerchants}</div><div class="metric-sub">전체</div></div>
      <div class="metric"><div class="metric-label">이번 달 VAN 수익</div><div class="metric-value">₩${vanRevenue.toLocaleString()}원</div><div class="metric-sub">${thisMonth}</div></div>
      <div class="metric"><div class="metric-label">이번 달 PG 수익</div><div class="metric-value">₩${pgRevenue.toLocaleString()}원</div><div class="metric-sub">${thisMonth}</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-header"><div class="card-title">최근 발주 현황</div></div>
        ${(orders||[]).length === 0 ? emptyState('발주 내역이 없습니다') : `
        <table><thead><tr><th>단말기</th><th>수량</th><th>상태</th></tr></thead><tbody>
        ${(orders||[]).map(o => `<tr><td>${o.terminal_name||'-'}</td><td>${o.quantity}</td><td>${statusBadge(o.status, 'order')}</td></tr>`).join('')}
        </tbody></table>`}
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">최근 설치/회수</div></div>
        ${(installs||[]).length === 0 ? emptyState('이력이 없습니다') : `
        <table><thead><tr><th>가맹점</th><th>단말기</th><th>구분</th></tr></thead><tbody>
        ${(installs||[]).map(i => `<tr><td>${i.merchants?.name||'-'}</td><td>${i.terminals?.name||'-'}</td><td>${i.type==='설치'?'<span class="badge badge-green">설치</span>':'<span class="badge badge-red">회수</span>'}</td></tr>`).join('')}
        </tbody></table>`}
      </div>
    </div>`;
  } catch(e) {
    content.innerHTML = dbError(e);
  }
}

// =============================================
// TERMINALS
// =============================================
async function renderTerminals() {
  const content = document.getElementById('content');
  try {
    const { data, error } = await db.from('terminals').select('*').order('name');
    if (error) throw error;
    content.innerHTML = `<div class="card">
      <div class="card-header"><div class="card-title">등록된 단말기 종류</div><div style="display:flex;gap:8px;"><button class="btn btn-sm btn-excel" onclick="exportTableExcel('terminal-list','단말기목록')">📊 엑셀 저장</button><button class="btn btn-sm btn-pdf" onclick="exportTablePDF('단말기 관리','terminal-list')">📄 PDF 저장</button></div></div>
      ${(data||[]).length === 0 ? emptyState('등록된 단말기가 없습니다.<br>오른쪽 상단에서 추가해주세요.') : `
      <table><thead><tr><th>단말기명</th><th>모델코드</th><th>구분</th><th>단가</th><th>재고</th><th>상태</th><th></th></tr></thead><tbody>
      ${data.map(t => `<tr>
        <td><strong>${t.name}</strong></td>
        <td style="color:#888">${t.model_code||'-'}</td>
        <td>${typeBadge(t.type)}</td>
        <td>₩${(t.price||0).toLocaleString()}</td>
        <td><strong>${t.stock||0}</strong></td>
        <td>${t.status==='판매중'?'<span class="badge badge-green">판매중</span>':t.status==='단종예정'?'<span class="badge badge-amber">단종예정</span>':'<span class="badge badge-gray">단종</span>'}</td>
        <td style="display:flex;gap:6px;">
          <button class="btn btn-sm" onclick="openEditTerminal(${JSON.stringify(t).replace(/"/g,'&quot;')})">편집</button>
          <button class="btn btn-sm btn-danger" onclick="deleteTerminal(${t.id},'${t.name}')">삭제</button>
        </td>
      </tr>`).join('')}
      </tbody></table>`}
    </div>`;
  } catch(e) { content.innerHTML = dbError(e); }
}

function openAddTerminal() {
  openModal('단말기 추가', terminalForm(), async () => {
    const name = v('t-name'); const model = v('t-model'); const type = v('t-type');
    const price = parseInt(v('t-price'))||0; const stock = parseInt(v('t-stock'))||0; const status = v('t-status');
    if (!name) return toast('단말기명을 입력해주세요.', 'error');
    const { error } = await db.from('terminals').insert({ name, model_code: model, type, price, stock, status });
    if (error) return toast('저장 실패: ' + error.message, 'error');
    toast('단말기가 추가되었습니다.'); closeModal(); renderTerminals();
  });
}

function openEditTerminal(t) {
  openModal('단말기 편집', terminalForm(t), async () => {
    const name = v('t-name'); const model = v('t-model'); const type = v('t-type');
    const price = parseInt(v('t-price'))||0; const stock = parseInt(v('t-stock'))||0; const status = v('t-status');
    if (!name) return toast('단말기명을 입력해주세요.', 'error');
    const { error } = await db.from('terminals').update({ name, model_code: model, type, price, stock, status }).eq('id', t.id);
    if (error) return toast('저장 실패: ' + error.message, 'error');
    toast('수정되었습니다.'); closeModal(); renderTerminals();
  });
}

async function deleteTerminal(id, name) {
  if (!confirm(`"${name}" 단말기를 삭제할까요?`)) return;
  const { error } = await db.from('terminals').delete().eq('id', id);
  if (error) return toast('삭제 실패: ' + error.message, 'error');
  toast('삭제되었습니다.'); renderTerminals();
}

function terminalForm(t = {}) {
  return `
  <div class="form-row"><div class="form-group"><label class="form-label">단말기명 *</label><input id="t-name" class="form-input" value="${t.name||''}" placeholder="예: IC카드 단말기 A형"/></div>

async function renderInventory() {
  const content = document.getElementById('content');
  try {
    const [{ data: terminals }, { data: installs }, { data: orders }] = await Promise.all([
      db.from('terminals').select('*').order('name'),
      db.from('installs').select('terminal_id, type'),
      db.from('orders').select('terminal_name, quantity, status'),
    ]);

    const installed = {};
    (installs||[]).forEach(i => { if(i.type==='설치') installed[i.terminal_id] = (installed[i.terminal_id]||0)+1; else installed[i.terminal_id] = (installed[i.terminal_id]||0)-1; });
    const pending = {};
    (orders||[]).filter(o=>o.status==='배송중'||o.status==='발주확인'||o.status==='발주요청').forEach(o => { pending[o.terminal_name] = (pending[o.terminal_name]||0) + o.quantity; });

    const totalStock = (terminals||[]).reduce((s,t)=>s+(t.stock||0),0);
    const totalInstalled = Object.values(installed).reduce((s,v)=>s+Math.max(0,v),0);
    const totalPending = Object.values(pending).reduce((s,v)=>s+v,0);

    content.innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="metric-label">창고 재고</div><div class="metric-value">${totalStock}</div></div>
      <div class="metric"><div class="metric-label">설치 운용 중</div><div class="metric-value">${totalInstalled}</div></div>
      <div class="metric"><div class="metric-label">입고 예정</div><div class="metric-value">${totalPending}</div></div>
      <div class="metric"><div class="metric-label">총 단말기 종류</div><div class="metric-value">${(terminals||[]).length}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">단말기별 재고 현황</div></div>
      <table><thead><tr><th>단말기</th><th>구분</th><th>창고 재고</th><th>설치 중</th><th>입고 예정</th></tr></thead><tbody>
      ${(terminals||[]).map(t => `<tr>
        <td><strong>${t.name}</strong></td>
        <td>${typeBadge(t.type)}</td>
        <td><strong>${t.stock||0}</strong></td>
        <td>${Math.max(0, installed[t.id]||0)}</td>
        <td style="color:#1a56a0">${pending[t.name]||0}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`;
  } catch(e) { content.innerHTML = dbError(e); }
}

async function renderRevenue() {
  const content = document.getElementById('content');
  try {
    const { data, error } = await db.from('revenue').select('*, merchants(name)').order('month', { ascending: false });
    if (error) throw error;

    const thisMonth = new Date().toISOString().slice(0,7);
    const thisMonthData = (data||[]).filter(r=>r.month===thisMonth);
    const totalVan = thisMonthData.reduce((s,r)=>s+(r.van_revenue||0),0);
    const totalPg = thisMonthData.reduce((s,r)=>s+(r.pg_revenue||0),0);
    const total = totalVan + totalPg;
    const vanPct = total>0 ? Math.round(totalVan/total*100) : 0;
    const pgPct = 100 - vanPct;

    content.innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="metric-label">이번 달 총 수익</div><div class="metric-value" style="font-size:18px">₩${total.toLocaleString()}원</div></div>
      <div class="metric"><div class="metric-label">VAN 수익</div><div class="metric-value" style="font-size:18px">₩${totalVan.toLocaleString()}원</div><div class="metric-sub">${vanPct}%</div></div>
      <div class="metric"><div class="metric-label">PG 수익</div><div class="metric-value" style="font-size:18px">₩${totalPg.toLocaleString()}원</div><div class="metric-sub">${pgPct}%</div></div>
      <div class="metric"><div class="metric-label">이번 달 입력 건수</div><div class="metric-value">${thisMonthData.length}건</div></div>
    </div>
    ${total>0?`<div class="card"><div class="card-header"><div class="card-title">VAN vs PG 비중</div></div>
    <div class="rev-split"><div class="rev-van" style="width:${vanPct}%"></div><div class="rev-pg" style="width:${pgPct}%"></div></div>
    <div style="display:flex;gap:16px;font-size:12px;color:#888;margin-top:6px;">
      <span>🟢 VAN ${vanPct}%</span><span>🔵 PG ${pgPct}%</span>
    </div></div>`:''}
    <div class="card">
      <div class="card-header"><div class="card-title">매출 내역</div><div style="display:flex;gap:8px;"><button class="btn btn-sm btn-excel" onclick="exportRevenueExcel()">📊 엑셀 저장</button><button class="btn btn-sm btn-pdf" onclick="exportRevenuePDF()">📄 PDF 저장</button></div></div>
      ${(data||[]).length===0 ? emptyState('매출 내역이 없습니다.') : `
      <table><thead><tr><th>월</th><th>가맹점</th><th>가맹점 매출</th><th>VAN 수익</th><th>PG 수익</th><th>메모</th><th></th></tr></thead><tbody id='revenue-list'>
      ${data.map(r => `<tr>
        <td>${r.month}</td>
        <td>${r.merchants?.name||'-'}</td>
        <td>₩${(r.merchant_sales||0).toLocaleString()}</td>
        <td style="color:#0a6644">₩${(r.van_revenue||0).toLocaleString()}</td>
        <td style="color:#1a56a0">₩${(r.pg_revenue||0).toLocaleString()}</td>
        <td style="color:#888">${r.note||'-'}</td>
        <td><button class="btn btn-sm btn-danger" onclick="deleteRevenue(${r.id})">삭제</button></td>
      </tr>`).join('')}
      </tbody></table>`}
    </div>`;
  } catch(e) { content.innerHTML = dbError(e); }
}

function openAddRevenue() {
  db.from('merchants').select('id,name').then(({data}) => {
    const opts = (data||[]).map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
    openModal('매출 입력', `
    <div class="form-row">
      <div class="form-group"><label class="form-label">가맹점 *</label><select id="r-merchant" class="form-select">${opts||'<option>가맹점 없음</option>'}</select></div>
      <div class="form-group"><label class="form-label">정산 월 *</label><input id="r-month" class="form-input" type="month" value="${new Date().toISOString().slice(0,7)}"/></div>
    </div>
    <div class="form-row3">
      <div class="form-group"><label class="form-label">가맹점 매출 (원)</label><input id="r-sales" class="form-input" type="number" placeholder="0"/></div>
      <div class="form-group"><label class="form-label">VAN 수익 (원)</label><input id="r-van" class="form-input" type="number" placeholder="0"/></div>
      <div class="form-group"><label class="form-label">PG 수익 (원)</label><input id="r-pg" class="form-input" type="number" placeholder="0"/></div>
    </div>
    <div class="form-group"><label class="form-label">메모</label><input id="r-note" class="form-input" placeholder="메모"/></div>`, async () => {
      const merchant_id = v('r-merchant'); const month = v('r-month');
      if (!merchant_id || !month) return toast('가맹점과 월을 선택해주세요.', 'error');
      const { error } = await db.from('revenue').insert({ merchant_id: parseInt(merchant_id), month, merchant_sales: parseInt(v('r-sales'))||0, van_revenue: parseInt(v('r-van'))||0, pg_revenue: parseInt(v('r-pg'))||0, note: v('r-note') });
      if (error) return toast('저장 실패: ' + error.message, 'error');
      toast('매출이 입력되었습니다.'); closeModal(); renderRevenue();
    });
  });
}

async function deleteRevenue(id) {
  if (!confirm('이 항목을 삭제할까요?')) return;
  const { error } = await db.from('revenue').delete().eq('id', id);
  if (error) return toast('삭제 실패', 'error');
  toast('삭제되었습니다.'); renderRevenue();
}

// =============================================
// EXPORT FUNCTIONS
// =============================================
function exportTableExcel(tbodyId, filename) {
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return toast('내보낼 데이터가 없습니다.', 'error');
  const table = tbody.closest('table');
  const ws = XLSX.utils.table_to_sheet(table);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, filename);
  XLSX.writeFile(wb, filename + '_' + today() + '.xlsx');
  toast('엑셀 파일이 저장되었습니다.');
}

function exportRevenueExcel() {
  exportTableExcel('revenue-list', '매출정산내역');
}

function exportTablePDF(title, tbodyId) {
  const { jsPDF } = window.jspdf;
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return toast('내보낼 데이터가 없습니다.', 'error');
  const table = tbody.closest('table');
  const headers = [];
  const rows = [];
  table.querySelectorAll('thead th').forEach(th => headers.push(th.innerText));
  table.querySelectorAll('tbody tr').forEach(tr => {
    const row = [];
    tr.querySelectorAll('td').forEach((td, i) => {
      if (i < headers.length) row.push(td.innerText.trim());
    });
    if (row.length) rows.push(row);
  });
  const doc = new jsPDF({ orientation: 'landscape' });
  doc.setFont('helvetica');
  doc.setFontSize(14);
  doc.text(title + ' (' + today() + ')', 14, 16);
  doc.autoTable({ head: [headers], body: rows, startY: 22, styles: { fontSize: 9 }, headStyles: { fillColor: [22, 33, 62] } });
  doc.save(title + '_' + today() + '.pdf');
  toast('PDF 파일이 저장되었습니다.');
}

function exportRevenuePDF() {
  exportTablePDF('매출/정산 내역', 'revenue-list');
}

// =============================================
// HELPERS
// =============================================
function v(id) { return document.getElementById(id)?.value || ''; }
function today() { return new Date().toISOString().slice(0,10); }

function typeBadge(type) {
  if (type==='VAN') return '<span class="badge badge-blue">VAN</span>';
  if (type==='PG') return '<span class="badge badge-amber">PG</span>';
  return '<span class="badge badge-gray">VAN+PG</span>';
}

function statusBadge(status, ctx) {
  const map = { '발주요청':'badge-gray','발주확인':'badge-blue','배송중':'badge-amber','입고완료':'badge-green','설치완료':'badge-teal' };
  return `<span class="badge ${map[status]||'badge-gray'}">${status}</span>`;
}

function merchantStatus(s) {
  if (s==='운영중') return '<span class="badge badge-green">운영중</span>';
  if (s==='계약중') return '<span class="badge badge-amber">계약중</span>';
  return '<span class="badge badge-red">해지</span>';
}

function emptyState(msg) {
  return `<div class="empty-state"><div class="es-icon">📭</div><div class="es-text">${msg}</div></div>`;
}

function dbError(e) {
  return `<div class="card"><div style="color:#b91c1c;font-size:13px;padding:16px;">⚠️ 데이터베이스 연결 오류: ${e.message}<br><br><strong>supabase.js에 올바른 URL과 키를 입력했는지 확인해주세요.</strong></div></div>`;
}
