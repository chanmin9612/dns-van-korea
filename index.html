async function saveKisToSupabase(month) {
  if (!window._kisResult) return toast('먼저 분석을 실행해주세요.', 'error');
  if (!confirm(month + ' 정산 데이터를 Supabase에 저장할까요?\n기존 동일 월 데이터는 덮어씁니다.')) return;

  // 저장할 데이터 미리 준비 — 거래 0건 가맹점도 포함 (휴면 상태로 정확히 반영하기 위함)
  // 승인/DESC/현금 중 하나라도 데이터가 있으면 포함 (완전히 매칭 안 된 것만 제외)
  const saveData = JSON.parse(JSON.stringify(
    window._kisResult.results.filter(r => r.approval >= 0)
  ));
  const saveMonth = month;

  toast('저장 중... 잠시만 기다려주세요.');

  // ── 1. 기존 데이터 삭제 ──
  const { error: delError } = await db.from('kis_settlement')
    .delete().eq('month', saveMonth);
  if (delError) return toast('삭제 실패: ' + delError.message, 'error');

  // 삭제 후 잠깐 대기 (DB 반영 시간)
  await new Promise(r => setTimeout(r, 500));

  // ── 2. 새 데이터 insert (50건씩) ──
  const rows = saveData.map(r => ({
    month: saveMonth,
    merchant_name: r.name,
    biz_no: r.biz_no,
    approval_count: r.approval,
    desc_count: r.desc,
    cash_count: r.cash,
    avg_amount: Math.round(r.avg),
    monthly_amount: Math.round(r.monthly),
    fee_van: Math.round(r.feeVan),
    fee_desc: Math.round(r.feeDesc),
    fee_cash: Math.round(r.feeCash),
    fee_total: Math.round(r.total)
  }));

  for (let i = 0; i < rows.length; i += 50) {
    const chunk = rows.slice(i, i + 50);
    const { error } = await db.from('kis_settlement').insert(chunk);
    if (error) return toast('저장 실패: ' + error.message, 'error');
  }

  // 저장 확인
  await new Promise(r => setTimeout(r, 300));
  const { data: check } = await db.from('kis_settlement')
    .select('id').eq('month', saveMonth).limit(1);
  if (!check || check.length === 0) {
    return toast('저장 확인 실패 — 다시 시도해주세요.', 'error');
  }

  // ── 3. 가맹점 자동 업데이트 ──
  const prevMonth = (() => {
    const d = new Date(saveMonth + '-01');
    d.setMonth(d.getMonth() - 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  })();
  const { data: prevData } = await db.from('kis_settlement')
    .select('merchant_name,approval_count').eq('month', prevMonth);
  const prevMap = {};
  (prevData||[]).forEach(r => { prevMap[r.merchant_name] = r.approval_count || 0; });

  const { data: merchantList } = await db.from('merchants').select('id,name,biz_no,risk_level');
  const merchantByBiz = {}, merchantByName = {};
  (merchantList||[]).forEach(m => {
    const biz = (m.biz_no||'').replace(/-/g,'').trim();
    if (biz) merchantByBiz[biz] = m;
    merchantByName[m.name] = m;
  });

  let updateCount = 0, skipCount = 0;
  let csCreatedCount = 0;
  const unmatchedList = [];  // 미매칭 가맹점명+수익 기록

  // 이미 등록된 미해결 '가맹점 관리' CS 티켓 조회 (중복 생성 방지)
  const { data: existingCS } = await db.from('cs_tickets')
    .select('merchant_name,issue_type,status')
    .neq('status', '완료');
  const existingCSSet = new Set(
    (existingCS||[])
      .filter(c => c.issue_type === '가맹점 관리')
      .map(c => c.merchant_name)
  );

  for (const r of saveData) {
    const merchant = merchantByBiz[(r.biz_no||'').replace(/-/g,'').trim()] || merchantByName[r.name];
    if (!merchant) {
      skipCount++;
      unmatchedList.push({ name: r.name, biz_no: r.biz_no, total: Math.round(r.total) });
      continue;
    }
    const prev = prevMap[r.name] || 0;
    const drop = prev > 0 ? (prev - r.approval) / prev * 100 : 0;
    // '폐업' 수동 지정된 가맹점은 자동 분류로 덮어쓰지 않음 (건수/금액만 갱신)
    const risk_level = merchant.risk_level === '폐업'
      ? '폐업'
      : r.approval === 0 ? '휴면' : (prev > 0 && drop >= 30) ? '이탈위험' : '정상';
    const { error: upErr } = await db.from('merchants').update({
      monthly_count: r.approval,
      monthly_amount: Math.round(r.monthly),
      risk_level,
      survey_done: true
    }).eq('id', merchant.id);
    if (!upErr) updateCount++;

    // 관리 필요 가맹점 → CS 관리에 자동 등록 (이미 미해결 티켓 있으면 스킵)
    if ((risk_level === '이탈위험' || risk_level === '휴면') && !existingCSSet.has(r.name)) {
      const issueDesc = risk_level === '휴면'
        ? `${saveMonth} 결제 건수 0건 — 휴면 가맹점 확인 필요`
        : `${saveMonth} 결제 건수 전월 대비 ${Math.round(drop)}% 감소 (${prev}건 → ${r.approval}건) — 이탈 위험 확인 필요`;
      const { error: csErr } = await db.from('cs_tickets').insert({
        ticket_no: genNo('CS'),
        merchant_name: r.name,
        issue_type: '가맹점 관리',
        issue_desc: issueDesc,
        priority: risk_level === '휴면' ? '보통' : '긴급',
        status: '접수'
      });
      if (!csErr) { csCreatedCount++; existingCSSet.add(r.name); }
    }
  }

  const skipMsg = skipCount > 0 ? ` / 미매칭 ${skipCount}곳` : '';
  const csMsg = csCreatedCount > 0 ? ` / CS 자동등록 ${csCreatedCount}건` : '';
  toast(`${saveMonth} 저장 완료 — ${rows.length}건 / 가맹점 ${updateCount}곳 업데이트${csMsg}${skipMsg}`);

  // 미매칭 가맹점 목록을 화면에 표시 (수익 큰 순으로 정렬)
  window._kisUnmatched = unmatchedList.sort((a,b) => b.total - a.total);

  window._kisResult = null;
  window._kisViewMonth = saveMonth;
  window._kisUploadMonth = saveMonth;
  await loadKisFromSupabase(saveMonth);
}

async function renderRevenueHistory() {
  try {
    // Supabase kis_settlement에서 월별 집계
    const { data: kisData } = await db.from('kis_settlement')
      .select('month,fee_van,fee_desc,fee_cash,fee_total')
      .order('month', { ascending: true });

    const { data: manualData } = await db.from('revenue')
      .select('month,van_revenue,pg_revenue')
      .order('month', { ascending: true });

    // 월별 집계
    const monthMap = {};
    (kisData||[]).forEach(r => {
      if (!monthMap[r.month]) monthMap[r.month] = { van:0, desc:0, cash:0, manual:0 };
      monthMap[r.month].van  += r.fee_van || 0;
      monthMap[r.month].desc += r.fee_desc || 0;
      monthMap[r.month].cash += r.fee_cash || 0;
    });
    (manualData||[]).forEach(r => {
      if (!monthMap[r.month]) monthMap[r.month] = { van:0, desc:0, cash:0, manual:0 };
      monthMap[r.month].manual += (r.van_revenue||0) + (r.pg_revenue||0);
    });

    const months = Object.keys(monthMap).sort();

    if (months.length === 0) {
      document.getElementById('revenue-tab-content').innerHTML =
        '<div class="card" style="padding:40px;text-align:center;color:#888">' +
        'KIS 정산 데이터를 Supabase에 저장하면 월별 추이를 확인할 수 있어요.</div>';
      return;
    }

    // 차트 + 테이블
    const maxVal = Math.max(...months.map(m => monthMap[m].van + monthMap[m].desc + monthMap[m].cash + monthMap[m].manual));
    let html = '<div class="card"><div class="card-header"><div class="card-title">📈 월별 수익 추이</div></div>';
    html += '<div style="padding:16px">';

    // 막대 차트
    html += '<div style="display:flex;align-items:flex-end;gap:12px;height:160px;margin-bottom:8px;padding:0 8px">';
    months.forEach(m => {
      const d = monthMap[m];
      const total = d.van + d.desc + d.cash + d.manual;
      const h = maxVal > 0 ? Math.round(total / maxVal * 140) : 0;
      html += `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
        <div style="font-size:10px;color:#1F3864;font-weight:600">₩${Math.round(total/10000)}만</div>
        <div style="width:100%;background:#1F3864;height:${h}px;border-radius:4px 4px 0 0;min-height:4px"></div>
        <div style="font-size:10px;color:#888">${m.slice(5)}월</div>
      </div>`;
    });
    html += '</div>';

    // 테이블
    html += '<table style="margin-top:8px"><thead><tr><th>월</th><th>유상후불</th><th>DESC</th><th>현금</th><th>수동입력</th><th style="color:#1F3864">합계</th></tr></thead><tbody>';
    months.slice().reverse().forEach(m => {
      const d = monthMap[m];
      const total = d.van + d.desc + d.cash + d.manual;
      html += `<tr>
        <td>${m}</td>
        <td style="text-align:right;color:#0a6644">₩${d.van.toLocaleString()}</td>
        <td style="text-align:right;color:#1a56a0">₩${d.desc.toLocaleString()}</td>
        <td style="text-align:right;color:#7c5cbf">₩${d.cash.toLocaleString()}</td>
        <td style="text-align:right;color:#888">₩${d.manual.toLocaleString()}</td>
        <td style="text-align:right;font-weight:700;color:#1F3864">₩${total.toLocaleString()}</td>
      </tr>`;
    });
    html += '</tbody></table></div></div>';
    document.getElementById('revenue-tab-content').innerHTML = html;
  } catch(e) {
    document.getElementById('revenue-tab-content').innerHTML = '<div class="card" style="padding:20px;color:red">❌ ' + e.message + '</div>';
  }
}

async function loadKisLatest() {
  // 가장 최근 월 데이터 로드 후 window._kisMap에 저장
  try {
    const { data } = await db.from('kis_settlement')
      .select('month,merchant_name,approval_count,fee_total')
      .order('month', { ascending: false });
    if (!data || data.length === 0) return;

    // 최근 2개 월 추출
    const months = [...new Set(data.map(r => r.month))].sort().reverse();
    const latestMonth  = months[0];
    const prevMonth    = months[1] || null;

    // 최근 월 가맹점별 맵
    const latestMap = {};
    data.filter(r => r.month === latestMonth).forEach(r => {
      latestMap[r.merchant_name] = {
        approval: r.approval_count || 0,
        total:    r.fee_total || 0
      };
    });

    // 전월 가맹점별 맵
    const prevMap = {};
    if (prevMonth) {
      data.filter(r => r.month === prevMonth).forEach(r => {
        prevMap[r.merchant_name] = {
          approval: r.approval_count || 0,
          total:    r.fee_total || 0
        };
      });
    }

    // 최근 월 합계
    const latestTotal = data.filter(r => r.month === latestMonth)
      .reduce((s,r) => s + (r.fee_total||0), 0);
    const prevTotal = prevMonth
      ? data.filter(r => r.month === prevMonth).reduce((s,r) => s + (r.fee_total||0), 0)
      : 0;

    // 수익 순위 계산
    const sorted = Object.entries(latestMap).sort((a,b) => b[1].total - a[1].total);
    const topNames = new Set(sorted.slice(0, Math.ceil(sorted.length * 0.2)).map(e => e[0]));
    const botNames = new Set(sorted.slice(-Math.ceil(sorted.length * 0.2)).map(e => e[0]));

    window._kisMap = latestMap;
    window._kisPrevMap = prevMap;
    window._kisLatestMonth = latestMonth;
    window._kisPrevMonth = prevMonth;
    window._kisLatestTotal = latestTotal;
    window._kisPrevTotal = prevTotal;
    window._kisTopNames = topNames;
    window._kisBotNames = botNames;
  } catch(e) {
    window._kisMap = {};
  }
}

// =============================================
// INIT
// =============================================
loadPage('dashboard');
</script>
